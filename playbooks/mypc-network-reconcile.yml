---
- name: Reconcile mypc Open WebUI/Admin container networks
  hosts: mypc
  gather_facts: false

  tasks:
    - name: Read-only reconcile preflight
      ansible.builtin.script:
        cmd: ../scripts/reconcile-open-webui-admin-network.sh --check
      environment:
        MYPC_DEPLOY_ENABLED: "{{ mypc_deploy_enabled | default('') }}"
        MYPC_NETWORK_RECONCILE_APPROVAL: "{{ mypc_network_reconcile_approval | default('') }}"
      check_mode: false
      changed_when: false

    - name: Execute atomic reconcile
      ansible.builtin.script:
        cmd: ../scripts/reconcile-open-webui-admin-network.sh --execute
      environment:
        MYPC_DEPLOY_ENABLED: "{{ mypc_deploy_enabled | default('') }}"
        MYPC_NETWORK_RECONCILE_APPROVAL: "{{ mypc_network_reconcile_approval | default('') }}"
      check_mode: false
      changed_when: false
      when: not ansible_check_mode
