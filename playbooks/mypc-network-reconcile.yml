---
- name: Reconcile mypc Open WebUI/Admin container networks
  hosts: mypc
  gather_facts: false

  vars:
    mypc_reconcile_core_network_name: openclaw-enterprise_openclaw-net
    mypc_reconcile_webui_network_name: openclaw-enterprise_open-webui-net
    mypc_reconcile_proxy_name: openclaw-webui-proxy
    mypc_reconcile_admin_name: openclaw-admin-console
    mypc_reconcile_temporary_proxy_networks:
      - "{{ mypc_reconcile_webui_network_name }}"
    mypc_reconcile_temporary_admin_networks:
      - "{{ mypc_reconcile_webui_network_name }}"
      - "{{ mypc_reconcile_core_network_name }}"
    mypc_reconcile_expected_proxy_networks:
      - "{{ mypc_reconcile_webui_network_name }}"
      - "{{ mypc_reconcile_core_network_name }}"
    mypc_reconcile_expected_admin_networks:
      - "{{ mypc_reconcile_core_network_name }}"

  pre_tasks:
    - name: Require the mypc deployment lane to be explicitly enabled
      ansible.builtin.assert:
        that:
          - mypc_deploy_enabled is defined
          - mypc_deploy_enabled | bool
        fail_msg: "Refusing network reconciliation unless mypc_deploy_enabled=true"

    - name: Require the independent network-reconcile approval
      ansible.builtin.assert:
        that:
          - mypc_network_reconcile_approval is defined
          - mypc_network_reconcile_approval | bool
        fail_msg: >-
          Refusing network reconciliation without the independent approval
          -e mypc_network_reconcile_approval=true

    - name: Read the remote hostname for the target guard
      ansible.builtin.command:
        argv: [/bin/hostname]
      register: mypc_reconcile_remote_hostname
      changed_when: false
      check_mode: false

    - name: Require the remote hostname to be exactly mypc
      ansible.builtin.assert:
        that:
          - mypc_reconcile_remote_hostname.rc == 0
          - mypc_reconcile_remote_hostname.stdout | trim == 'mypc'
        fail_msg: "Refusing network reconciliation unless /bin/hostname is exactly mypc"

  tasks:
    - name: Reconcile only the measured network topology
      block:
        - name: Inspect fixed Docker networks as JSON
          ansible.builtin.command:
            argv:
              - docker
              - network
              - inspect
              - "{{ mypc_reconcile_core_network_name }}"
              - "{{ mypc_reconcile_webui_network_name }}"
          register: mypc_reconcile_network_inspect
          changed_when: false
          check_mode: false

        - name: Inspect Proxy and Admin as JSON
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_container_inspect
          changed_when: false
          check_mode: false

        - name: Parse measured JSON and exact network sets
          ansible.builtin.set_fact:
            mypc_reconcile_networks: "{{ mypc_reconcile_network_inspect.stdout | from_json }}"
            mypc_reconcile_containers: "{{ mypc_reconcile_container_inspect.stdout | from_json }}"

        - name: Set measured IDs and network sets
          ansible.builtin.set_fact:
            mypc_reconcile_core_network_id: "{{ mypc_reconcile_networks[0]['Id'] }}"
            mypc_reconcile_webui_network_id: "{{ mypc_reconcile_networks[1]['Id'] }}"
            mypc_reconcile_proxy_id: "{{ mypc_reconcile_containers[0]['Id'] }}"
            mypc_reconcile_admin_id: "{{ mypc_reconcile_containers[1]['Id'] }}"
            mypc_reconcile_proxy_networks: >-
              {{ mypc_reconcile_containers[0]['NetworkSettings']['Networks'].keys() | list | sort }}
            mypc_reconcile_admin_networks: >-
              {{ mypc_reconcile_containers[1]['NetworkSettings']['Networks'].keys() | list | sort }}

        - name: Require fixed identities and only temporary or canonical starting state
          ansible.builtin.assert:
            that:
              - mypc_reconcile_networks | length == 2
              - mypc_reconcile_networks[0]['Name'] == mypc_reconcile_core_network_name
              - mypc_reconcile_networks[1]['Name'] == mypc_reconcile_webui_network_name
              - mypc_reconcile_containers | length == 2
              - mypc_reconcile_containers[0]['Name'] == ('/' ~ mypc_reconcile_proxy_name)
              - mypc_reconcile_containers[1]['Name'] == ('/' ~ mypc_reconcile_admin_name)
              - mypc_reconcile_containers[0]['State']['Running'] | bool
              - mypc_reconcile_containers[1]['State']['Running'] | bool
              - mypc_reconcile_networks[0]['Id'] | length > 0
              - mypc_reconcile_networks[1]['Id'] | length > 0
              - mypc_reconcile_containers[0]['Id'] | length > 0
              - mypc_reconcile_containers[1]['Id'] | length > 0
              - >-
                (mypc_reconcile_proxy_networks == mypc_reconcile_temporary_proxy_networks and
                 mypc_reconcile_admin_networks == mypc_reconcile_temporary_admin_networks) or
                (mypc_reconcile_proxy_networks == mypc_reconcile_expected_proxy_networks and
                 mypc_reconcile_admin_networks == mypc_reconcile_expected_admin_networks)
            fail_msg: >-
              Refusing a starting topology other than temporary or canonical; extra, missing,
              and already-in-progress attachments are not accepted

        - name: Save the measured baseline before any mutation
          ansible.builtin.set_fact:
            mypc_reconcile_baseline_proxy_networks: "{{ mypc_reconcile_proxy_networks }}"
            mypc_reconcile_baseline_admin_networks: "{{ mypc_reconcile_admin_networks }}"

        - name: Attach Proxy to core from the temporary state
          ansible.builtin.command:
            argv: [docker, network, connect, "{{ mypc_reconcile_core_network_id }}", "{{ mypc_reconcile_proxy_id }}"]
          register: mypc_reconcile_attach
          changed_when: mypc_reconcile_attach.rc == 0
          failed_when: >-
            mypc_deploy_enabled is not defined or not (mypc_deploy_enabled | bool) or
            mypc_network_reconcile_approval is not defined or not (mypc_network_reconcile_approval | bool) or
            mypc_reconcile_attach.rc != 0
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_proxy_networks == mypc_reconcile_temporary_proxy_networks
            - mypc_deploy_enabled is defined
            - mypc_deploy_enabled | bool
            - mypc_network_reconcile_approval is defined
            - mypc_network_reconcile_approval | bool

        - name: Inspect the exact state after Proxy attach
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_after_attach
          changed_when: false
          check_mode: false
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_proxy_networks == mypc_reconcile_temporary_proxy_networks

        - name: Require the exact post-attach state
          ansible.builtin.assert:
            that:
              - (mypc_reconcile_after_attach.stdout | from_json)[0]['Id'] == mypc_reconcile_proxy_id
              - (mypc_reconcile_after_attach.stdout | from_json)[1]['Id'] == mypc_reconcile_admin_id
              - >-
                ((mypc_reconcile_after_attach.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_expected_proxy_networks
              - >-
                ((mypc_reconcile_after_attach.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_temporary_admin_networks
            fail_msg: "Proxy attach was not observed as the exact expected transition state"
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_proxy_networks == mypc_reconcile_temporary_proxy_networks

        - name: Detach Admin from WebUI from the temporary state
          ansible.builtin.command:
            argv: [docker, network, disconnect, "{{ mypc_reconcile_webui_network_id }}", "{{ mypc_reconcile_admin_id }}"]
          register: mypc_reconcile_detach
          changed_when: mypc_reconcile_detach.rc == 0
          failed_when: >-
            mypc_deploy_enabled is not defined or not (mypc_deploy_enabled | bool) or
            mypc_network_reconcile_approval is not defined or not (mypc_network_reconcile_approval | bool) or
            mypc_reconcile_detach.rc != 0
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_admin_networks == mypc_reconcile_temporary_admin_networks
            - mypc_deploy_enabled is defined
            - mypc_deploy_enabled | bool
            - mypc_network_reconcile_approval is defined
            - mypc_network_reconcile_approval | bool

        - name: Inspect the exact state after Admin detach
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_after_detach
          changed_when: false
          check_mode: false
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_admin_networks == mypc_reconcile_temporary_admin_networks

        - name: Require the exact post-detach canonical state
          ansible.builtin.assert:
            that:
              - (mypc_reconcile_after_detach.stdout | from_json)[0]['Id'] == mypc_reconcile_proxy_id
              - (mypc_reconcile_after_detach.stdout | from_json)[1]['Id'] == mypc_reconcile_admin_id
              - >-
                ((mypc_reconcile_after_detach.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_expected_proxy_networks
              - >-
                ((mypc_reconcile_after_detach.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_expected_admin_networks
            fail_msg: "Admin detach was not observed as the exact canonical state"
          when:
            - not ansible_check_mode
            - mypc_reconcile_baseline_admin_networks == mypc_reconcile_temporary_admin_networks

        - name: Inspect final networks and containers
          ansible.builtin.command:
            argv:
              - docker
              - network
              - inspect
              - "{{ mypc_reconcile_core_network_name }}"
              - "{{ mypc_reconcile_webui_network_name }}"
          register: mypc_reconcile_final_networks
          changed_when: false
          check_mode: false

        - name: Inspect final Proxy and Admin
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_final_containers
          changed_when: false
          check_mode: false

        - name: Require final identity and exact state
          ansible.builtin.assert:
            that:
              - (mypc_reconcile_final_networks.stdout | from_json)[0]['Id'] == mypc_reconcile_core_network_id
              - (mypc_reconcile_final_networks.stdout | from_json)[1]['Id'] == mypc_reconcile_webui_network_id
              - (mypc_reconcile_final_containers.stdout | from_json)[0]['Id'] == mypc_reconcile_proxy_id
              - (mypc_reconcile_final_containers.stdout | from_json)[1]['Id'] == mypc_reconcile_admin_id
              - >-
                ansible_check_mode or
                (((mypc_reconcile_final_containers.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) == mypc_reconcile_expected_proxy_networks and
                 ((mypc_reconcile_final_containers.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort) == mypc_reconcile_expected_admin_networks)
              - >-
                not ansible_check_mode or
                (((mypc_reconcile_final_containers.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) in [mypc_reconcile_temporary_proxy_networks, mypc_reconcile_expected_proxy_networks] and
                 ((mypc_reconcile_final_containers.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort) in [mypc_reconcile_temporary_admin_networks, mypc_reconcile_expected_admin_networks])
            fail_msg: "Final network identity or exact topology check failed"

      rescue:
        - name: Rescue first re-inspects current Proxy and Admin JSON
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_rescue_inspect
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Parse current rescue network sets when available
          ansible.builtin.set_fact:
            mypc_reconcile_rescue_containers: "{{ mypc_reconcile_rescue_inspect.stdout | from_json }}"
            mypc_reconcile_rescue_proxy_networks: >-
              {{ (mypc_reconcile_rescue_inspect.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort }}
            mypc_reconcile_rescue_admin_networks: >-
              {{ (mypc_reconcile_rescue_inspect.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort }}
          when: mypc_reconcile_rescue_inspect.rc == 0
          ignore_errors: true

        - name: Reconnect Admin when baseline had WebUI and current state lacks it
          ansible.builtin.command:
            argv: [docker, network, connect, "{{ mypc_reconcile_webui_network_id }}", "{{ mypc_reconcile_admin_id }}"]
          register: mypc_reconcile_rescue_admin_reconnect
          changed_when: mypc_reconcile_rescue_admin_reconnect.rc == 0
          failed_when: >-
            mypc_deploy_enabled is not defined or not (mypc_deploy_enabled | bool) or
            mypc_network_reconcile_approval is not defined or not (mypc_network_reconcile_approval | bool) or
            mypc_reconcile_rescue_admin_reconnect.rc != 0
          when:
            - not ansible_check_mode
            - >-
              mypc_reconcile_baseline_admin_networks is defined and
              mypc_reconcile_rescue_admin_networks is defined and
              mypc_reconcile_webui_network_name in mypc_reconcile_baseline_admin_networks and
              mypc_reconcile_webui_network_name not in mypc_reconcile_rescue_admin_networks
            - mypc_reconcile_webui_network_id is defined
            - mypc_reconcile_admin_id is defined
            - mypc_deploy_enabled is defined
            - mypc_deploy_enabled | bool
            - mypc_network_reconcile_approval is defined
            - mypc_network_reconcile_approval | bool
          ignore_errors: true

        - name: Re-inspect Admin and assert its exact measured baseline
          ansible.builtin.command:
            argv: [docker, inspect, --type=container, "{{ mypc_reconcile_admin_name }}"]
          register: mypc_reconcile_rescue_admin_after
          changed_when: false
          failed_when: false
          check_mode: false
          when: mypc_reconcile_baseline_admin_networks is defined

        - name: Require Admin to match the measured baseline
          ansible.builtin.assert:
            that:
              - mypc_reconcile_rescue_admin_after.rc == 0
              - >-
                ((mypc_reconcile_rescue_admin_after.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_baseline_admin_networks
            fail_msg: "Rescue Admin topology does not match the measured baseline"
          when: mypc_reconcile_baseline_admin_networks is defined
          ignore_errors: true

        - name: Disconnect Proxy when baseline lacked core and current state has it
          ansible.builtin.command:
            argv: [docker, network, disconnect, "{{ mypc_reconcile_core_network_id }}", "{{ mypc_reconcile_proxy_id }}"]
          register: mypc_reconcile_rescue_proxy_disconnect
          changed_when: mypc_reconcile_rescue_proxy_disconnect.rc == 0
          failed_when: >-
            mypc_deploy_enabled is not defined or not (mypc_deploy_enabled | bool) or
            mypc_network_reconcile_approval is not defined or not (mypc_network_reconcile_approval | bool) or
            mypc_reconcile_rescue_proxy_disconnect.rc != 0
          when:
            - not ansible_check_mode
            - >-
              mypc_reconcile_baseline_proxy_networks is defined and
              mypc_reconcile_rescue_proxy_networks is defined and
              mypc_reconcile_core_network_name not in mypc_reconcile_baseline_proxy_networks and
              mypc_reconcile_core_network_name in mypc_reconcile_rescue_proxy_networks
            - mypc_reconcile_core_network_id is defined
            - mypc_reconcile_proxy_id is defined
            - mypc_deploy_enabled is defined
            - mypc_deploy_enabled | bool
            - mypc_network_reconcile_approval is defined
            - mypc_network_reconcile_approval | bool
          ignore_errors: true

        - name: Rescue re-inspects both containers and asserts the exact baseline
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --type=container
              - "{{ mypc_reconcile_proxy_name }}"
              - "{{ mypc_reconcile_admin_name }}"
          register: mypc_reconcile_rescue_final
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Require both rescue network sets to match the measured baseline
          ansible.builtin.assert:
            that:
              - mypc_reconcile_rescue_final.rc == 0
              - >-
                ((mypc_reconcile_rescue_final.stdout | from_json)[0]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_baseline_proxy_networks
              - >-
                ((mypc_reconcile_rescue_final.stdout | from_json)[1]['NetworkSettings']['Networks'].keys() | list | sort) ==
                mypc_reconcile_baseline_admin_networks
            fail_msg: "Rescue topology does not match the measured baseline"
          when:
            - mypc_reconcile_baseline_proxy_networks is defined
            - mypc_reconcile_baseline_admin_networks is defined
          ignore_errors: true

        - name: Preserve original failure and finish nonzero after rescue evidence
          ansible.builtin.fail:
            msg: >-
              Network reconciliation failed at {{ ansible_failed_task.name | default('unknown task') }}:
              {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('unknown error')) }}
