services:
  fruit-v4-setup:
    image: "${FRUIT_V4_IMAGE_REGISTRY:?Set FRUIT_V4_IMAGE_REGISTRY}/fruit-industry-pack@sha256:${FRUIT_V4_IMAGE_DIGEST:?Set FRUIT_V4_IMAGE_DIGEST}"
    container_name: fruit-v4-isolated-setup
    hostname: fruit-v4-isolated-setup
    profiles: [migration]
    command:
      - node
      - --input-type=module
      - -e
      - |-
          import { execFileSync } from "node:child_process";
          import { closeSync, openSync, readSync, statSync, writeSync } from "node:fs";

          const fail = (message) => {
            console.error("Fruit V4 setup preflight failed: " + message);
            process.exit(64);
          };
          const required = (name) => {
            const value = process.env[name];
            if (!value || value.trim() !== value) fail(name + " is required");
            return value;
          };
          const parseDsn = (name) => {
            let value;
            try {
              value = new URL(required(name));
            } catch {
              fail(name + " must be a valid URL");
            }
            if (value.protocol !== "postgres:" && value.protocol !== "postgresql:") {
              fail(name + " must use PostgreSQL");
            }
            if (value.search || value.hash) {
              fail(name + " must not include query parameters or fragments");
            }
            return value;
          };
          const decode = (value, name) => {
            try {
              return decodeURIComponent(value);
            } catch {
              fail(name + " must use valid URL encoding");
            }
          };
          const assertHex = (name, length) => {
            const value = required(name);
            if (value.length !== length || /[^0-9a-f]/.test(value)) {
              fail(name + " has invalid format");
            }
          };

          if (required("FRUIT_V4_MIGRATION_GATE") !== "approved-migration") {
            fail("FRUIT_V4_MIGRATION_GATE is not approved-migration");
          }
          assertHex("FRUIT_V4_SOURCE_SHA", 40);
          assertHex("FRUIT_V4_INFRA_REVISION", 40);
          assertHex("FRUIT_V4_IMAGE_DIGEST", 64);
          required("FRUIT_V4_RESTORE_REHEARSAL_ID");
          required("FRUIT_V4_OPERATOR_APPROVAL_ID");

          const expectedHost = required("FRUIT_V4_EXPECTED_DATABASE_HOST");
          const expectedPort = required("FRUIT_V4_EXPECTED_DATABASE_PORT");
          const expectedPath = required("FRUIT_V4_EXPECTED_DATABASE_PATH");
          if (/[^0-9]/.test(expectedPort)) {
            fail("FRUIT_V4_EXPECTED_DATABASE_PORT must be numeric");
          }
          if (!expectedPath.startsWith("/")) {
            fail("FRUIT_V4_EXPECTED_DATABASE_PATH must start with /");
          }

          const migration = parseDsn("DATABASE_URL");
          const runtime = parseDsn("FRUIT_V4_RUNTIME_DATABASE_URL");
          const writer = parseDsn("FRUIT_V4_WRITER_DATABASE_URL");
          const migrationUsername = decode(migration.username, "migration DSN username");
          const runtimeUsername = decode(runtime.username, "runtime DSN username");
          const runtimePassword = decode(runtime.password, "runtime DSN password");
          const writerUsername = decode(writer.username, "writer DSN username");
          const writerPassword = decode(writer.password, "writer DSN password");
          const runtimeRole = required("FRUIT_RUNTIME_DB_ROLE");
          const expectedRuntimePassword = required("FRUIT_RUNTIME_DB_PASSWORD");
          const writerRole = required("FRUIT_V4_WRITER_ROLE");
          const expectedWriterPassword = required("FRUIT_V4_WRITER_PASSWORD");
          for (const [name, dsn] of [
            ["migration", migration],
            ["runtime", runtime],
            ["writer", writer],
          ]) {
            if (
              dsn.hostname !== expectedHost ||
              dsn.port !== expectedPort ||
              dsn.pathname !== expectedPath
            ) {
              fail(name + " DSN does not match the approved database host/port/path");
            }
          }
          if (!migrationUsername) fail("migration DSN username is required");
          if (!runtimeUsername) fail("runtime DSN username is required");
          if (!runtimePassword) fail("runtime DSN password is required");
          if (!writerUsername) fail("writer DSN username is required");
          if (!writerPassword) fail("writer DSN password is required");
          if (writerUsername === runtimeUsername) {
            fail("writer and runtime DSN usernames must differ");
          }
          if (migrationUsername === runtimeUsername || migrationUsername === writerUsername) {
            fail("migration DSN username must differ from runtime and writer usernames");
          }
          if (runtimeUsername !== runtimeRole) {
            fail("runtime DSN username must equal FRUIT_RUNTIME_DB_ROLE");
          }
          if (runtimePassword !== expectedRuntimePassword) {
            fail("runtime DSN password must equal FRUIT_RUNTIME_DB_PASSWORD");
          }
          if (writerUsername !== writerRole) {
            fail("writer DSN username must equal FRUIT_V4_WRITER_ROLE");
          }
          if (writerPassword !== expectedWriterPassword) {
            fail("writer DSN password must equal FRUIT_V4_WRITER_PASSWORD");
          }

          // The backup gate has to answer "did somebody actually take a dump",
          // and the only way to answer that is to open the file. This block runs
          // last on purpose: it is the final check before the migration itself.
          const backupPath = required("FRUIT_V4_BACKUP_PATH");
          if (!backupPath.startsWith("/")) {
            fail("FRUIT_V4_BACKUP_PATH must be an absolute path");
          }
          if (backupPath === "/app" || backupPath.startsWith("/app/")) {
            fail("FRUIT_V4_BACKUP_PATH must not shadow the image contents at /app");
          }
          const declaredBytes = required("FRUIT_V4_BACKUP_BYTES");
          if (!/^[1-9][0-9]*$/.test(declaredBytes)) {
            fail("FRUIT_V4_BACKUP_BYTES must be a positive integer");
          }
          let backupStat;
          try {
            backupStat = statSync(backupPath);
          } catch {
            fail("backup file is missing at " + backupPath);
          }
          if (!backupStat.isFile()) {
            fail("backup file is not a regular file at " + backupPath);
          }
          if (String(backupStat.size) !== declaredBytes) {
            fail(
              "backup file at " + backupPath + " is " + backupStat.size +
                " bytes, not the declared FRUIT_V4_BACKUP_BYTES " + declaredBytes,
            );
          }
          // A custom-format dump starts with the literal PGDMP magic. This is the
          // strongest check that always runs: it needs no external tool and it
          // separates a real dump from a truncated or wrong file of equal size.
          let header;
          try {
            const backupFd = openSync(backupPath, "r");
            header = Buffer.alloc(5);
            readSync(backupFd, header, 0, 5, 0);
            closeSync(backupFd);
          } catch {
            fail("backup file is not readable at " + backupPath);
          }
          if (header.toString("latin1") !== "PGDMP") {
            fail(
              "backup file at " + backupPath +
                " is not a PostgreSQL custom-format dump",
            );
          }
          // Every check above runs unconditionally in this image. Nothing here
          // declares a value it cannot check: an entry count would need a
          // pg_restore that node:20-slim does not ship, and a declared-but-never
          // -compared integer is the same defect as the checksum this replaced.
          // The restore rehearsal in the runbook verifies the archive with a
          // real pg_restore, which proves more than counting its entries.
          writeSync(
            1,
            "Fruit V4 setup preflight verified backup evidence at " + backupPath +
              ": " + backupStat.size + " bytes, PGDMP custom-format dump\n",
          );

          execFileSync(
            process.execPath,
            ["packages/fruit-industry-pack/dist/db/setup.js"],
            { env: process.env, stdio: "inherit" },
          );
    environment:
      DATABASE_URL: ${FRUIT_V4_MIGRATION_DATABASE_URL:?Set FRUIT_V4_MIGRATION_DATABASE_URL}
      FRUIT_V4_RUNTIME_DATABASE_URL: ${FRUIT_V4_RUNTIME_DATABASE_URL:?Set FRUIT_V4_RUNTIME_DATABASE_URL}
      FRUIT_V4_WRITER_DATABASE_URL: ${FRUIT_V4_WRITER_DATABASE_URL:?Set FRUIT_V4_WRITER_DATABASE_URL}
      FRUIT_RUNTIME_DB_ROLE: ${FRUIT_V4_RUNTIME_DB_ROLE:?Set FRUIT_V4_RUNTIME_DB_ROLE}
      FRUIT_RUNTIME_DB_PASSWORD: ${FRUIT_V4_RUNTIME_DB_PASSWORD:?Set FRUIT_V4_RUNTIME_DB_PASSWORD}
      FRUIT_V4_WRITER_ROLE: ${FRUIT_V4_WRITER_ROLE:?Set FRUIT_V4_WRITER_ROLE}
      FRUIT_V4_WRITER_PASSWORD: ${FRUIT_V4_WRITER_PASSWORD:?Set FRUIT_V4_WRITER_PASSWORD}
      FRUIT_CONTROLLED_ENTRY_ENABLED: "true"
      FRUIT_SETUP_WAIT_MS: ${FRUIT_V4_SETUP_WAIT_MS:-60000}
      FRUIT_V4_EXPECTED_DATABASE_HOST: ${FRUIT_V4_EXPECTED_DATABASE_HOST:?Set FRUIT_V4_EXPECTED_DATABASE_HOST}
      FRUIT_V4_EXPECTED_DATABASE_PORT: ${FRUIT_V4_EXPECTED_DATABASE_PORT:?Set FRUIT_V4_EXPECTED_DATABASE_PORT}
      FRUIT_V4_EXPECTED_DATABASE_PATH: ${FRUIT_V4_EXPECTED_DATABASE_PATH:?Set FRUIT_V4_EXPECTED_DATABASE_PATH}
      FRUIT_V4_SOURCE_SHA: ${FRUIT_V4_SOURCE_SHA:?Set FRUIT_V4_SOURCE_SHA}
      FRUIT_V4_INFRA_REVISION: ${FRUIT_V4_INFRA_REVISION:?Set FRUIT_V4_INFRA_REVISION}
      FRUIT_V4_IMAGE_DIGEST: ${FRUIT_V4_IMAGE_DIGEST:?Set FRUIT_V4_IMAGE_DIGEST}
      FRUIT_V4_BACKUP_PATH: ${FRUIT_V4_BACKUP_PATH:?Set FRUIT_V4_BACKUP_PATH}
      FRUIT_V4_BACKUP_BYTES: ${FRUIT_V4_BACKUP_BYTES:?Set FRUIT_V4_BACKUP_BYTES}
      FRUIT_V4_RESTORE_REHEARSAL_ID: ${FRUIT_V4_RESTORE_REHEARSAL_ID:?Set FRUIT_V4_RESTORE_REHEARSAL_ID}
      FRUIT_V4_OPERATOR_APPROVAL_ID: ${FRUIT_V4_OPERATOR_APPROVAL_ID:?Set FRUIT_V4_OPERATOR_APPROVAL_ID}
      FRUIT_V4_MIGRATION_GATE: ${FRUIT_V4_MIGRATION_GATE:?Set FRUIT_V4_MIGRATION_GATE}
    # The single deliberate exception to this contract's no-volume rule, and the
    # thing that makes the backup gate real instead of declarative: the preflight
    # cannot open a file the container cannot see. Read-only, one file, mounted at
    # the same absolute path the operator declared, so failures name a path the
    # operator recognises. create_host_path is false so a missing dump fails the
    # mount instead of Docker silently materialising an empty directory. The dump
    # must be readable by the image's `node` user (UID 1000).
    volumes:
      - type: bind
        source: ${FRUIT_V4_BACKUP_PATH:?Set FRUIT_V4_BACKUP_PATH}
        target: ${FRUIT_V4_BACKUP_PATH:?Set FRUIT_V4_BACKUP_PATH}
        read_only: true
        bind:
          create_host_path: false
    labels:
      com.vecta.contract: fruit-v4-isolated-production-compose
      com.vecta.owner: vecta-infra
      com.vecta.service: fruit-industry-pack
      com.vecta.expected.image.source.repository: ZenoWangzy/vecta
      com.vecta.expected.image.source.revision: ${FRUIT_V4_SOURCE_SHA:?Set FRUIT_V4_SOURCE_SHA}
      com.vecta.deployment.repository: ZenoWangzy/vecta-infra
      com.vecta.deployment.revision: ${FRUIT_V4_INFRA_REVISION:?Set FRUIT_V4_INFRA_REVISION}
      com.vecta.expected.image.repository: ${FRUIT_V4_IMAGE_REGISTRY:?Set FRUIT_V4_IMAGE_REGISTRY}/fruit-industry-pack
      com.vecta.expected.image.digest: sha256:${FRUIT_V4_IMAGE_DIGEST:?Set FRUIT_V4_IMAGE_DIGEST}
      com.vecta.role: setup
    networks: [production]
    restart: "no"
