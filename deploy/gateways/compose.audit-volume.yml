# vecta#1036 — AUDIT_DIR is not a mounted volume, so the signed audit chain
# (packages/fleet-gateway/src/audit/{writer,consumer}.ts, HMAC chain in
# integrity.ts) lives in fleet-gateway's writable container layer and is
# silently destroyed every time the container is recreated. The chain re-signs
# itself cleanly after each loss, so nothing about it looks wrong — that is
# the whole defect. vecta-infra owns the volume declaration (vecta's Issues
# are disabled, defect tracked as vecta#1036).
#
# WHY A NEW OVERLAY AND NOT AN EDIT TO AN EXISTING ONE.
# Same reasoning as compose.healthchecks.yml (ticket 106) in this same
# directory: the `openclaw-enterprise` project's `-f` chain has no source of
# truth other than the running container's own
# `com.docker.compose.project.config_files` label, the base
# `/data/ocee/migration-compose.config.yml` is a hand-restored 2026-08
# snapshot, and every `releases/*` overlay is a one-off written in its own
# deploy window. Editing any of those would either get silently reverted by
# the next release overlay or rewrite an already-deployed artifact. A
# permanent, additive member of the chain (this file) survives every future
# release the same way the healthcheck overlay does.
#
# WHAT WAS ACTUALLY CHECKED BEFORE WRITING THIS (lessons/RULES.md D26 — before
# writing a declarative recreate config for a container with no compose
# project or systemd unit, get the FULL mount table, because docker rm +
# docker run/docker_container only recreates volumes the declaration
# mentions, and an anonymous volume not mentioned anywhere is silently
# orphaned with the container getting a fresh empty one instead):
#
#   docker inspect --format '{{json .Mounts}}' openclaw-fleet-gateway
#
# 2026-09-07: six bind mounts (knowledge, litellm-config, docker.sock,
# data/instances, templates, shared-plugins) — ZERO volume-type mounts, and
# critically **not even an anonymous one** at /app/data/audit. AUDIT_DIR is
# unset in the container's env (confirmed via the merged
# `docker compose ... config --format json` over the live 31-file `-f` chain,
# not just this base file, per F76 — overrides can rewrite env, not just
# image tags), so the app falls back to its own default (`./data/audit`,
# `packages/fleet-gateway/src/audit/{writer,consumer}.ts`), which resolves
# under the container's cwd (`/app`) to `/app/data/audit` — plain overlay
# filesystem, gone on every `docker rm`. D26's "reference the existing
# anonymous volume by its current name" does not apply here because there is
# no existing volume of any kind to preserve — the fix is to introduce one
# for the first time, and production adoption must seed it from the running
# container's current `/app/data/audit` content (docker cp) before the mount
# takes effect, so today's not-yet-lost entries survive the switch instead of
# being replaced by an empty new volume.
#
# WHY `external: true`. A plain (non-external) named volume gets silently
# auto-created empty by `docker compose up` / `docker_container` if it's ever
# missing — exactly the failure mode this ticket exists to close. Marking it
# external makes a missing volume a hard failure (`no such volume`) instead
# of a silent empty remount, so the next person who tears this host down
# without reading this file finds out immediately instead of the chain
# quietly resetting again. Create it once, by hand, before this overlay is
# added to the `-f` chain:
#
#   docker volume create fleet_gateway_audit_data
#   docker run --rm -v fleet_gateway_audit_data:/audit --user 0 \
#     127.0.0.1:8082/fleet-gateway:<current running tag> \
#     chown -R 1000:1000 /audit
#
# The chown step is required and easy to miss: fleet-gateway runs as
# uid:gid 1000:1000 (`docker inspect --format '{{.Config.User}}'`), but a
# freshly created Docker volume's mount point is owned by root, so the app's
# own `mkdirSync`/`appendFileSync` in the audit writer would fail with EACCES
# the moment the new mount replaced the writable-layer directory it created
# for itself. Confirmed by reproducing the EACCES in an isolated rehearsal
# before finding this line.
#
# AUDIT_DIR is pinned explicitly below instead of left to the code default so
# the mount target and the app's expectation are both spelled out in one
# place — no future Dockerfile WORKDIR change can silently move where the
# chain lands.
#
# Install and rollback: same mechanics as
# docs/runbooks/gateway-healthchecks-and-watch.md §2 (rebuild the live `-f`
# chain from the container's own label, append this file, `config -q`, then
# `up -d --no-deps fleet-gateway`) — this changes a mount, which (like
# healthcheck/logging) requires container re-creation, so it lands in a
# deploy window under the production deploy lock, not applied ad hoc.
services:
  fleet-gateway:
    environment:
      AUDIT_DIR: /app/data/audit
    volumes:
      - type: volume
        source: fleet_gateway_audit_data
        target: /app/data/audit
volumes:
  fleet_gateway_audit_data:
    external: true
