# HTTP context; only the location snippet below selects this cache.
proxy_cache_path /var/cache/nginx/vecta-chat-assets levels=1:2 keys_zone=vecta_chat_assets:16m max_size=256m inactive=24h use_temp_path=off;
map $upstream_http_content_type $vecta_chat_asset_no_cache {
    default 1;
    "~*^(application/javascript|text/javascript|text/css)(;|$)" 0;
}
map $upstream_http_set_cookie $vecta_chat_asset_cookie_no_cache {
    default 1;
    "" 0;
    "~^vecta_cache_reset_0929b=1; Path=/; Max-Age=31536000; Secure; SameSite=Lax$" 0;
}
