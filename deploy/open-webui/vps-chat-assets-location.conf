# Include inside vecta.matrix-ai.com.cn's TLS server. HTML/API stay on existing routes.
location ~ ^/chat/(?:_app/immutable/(?:entry|chunks|nodes|assets)/[A-Za-z0-9_.-]+\.(?:js|css)|static/(?:branding\.js|custom\.css))$ {
    limit_except GET { deny all; }
    proxy_pass http://vecta_webui_upstream;
    proxy_http_version 1.1;
    # These files are already public at the gateway. Never forward browser identity.
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;
    gzip on;
    gzip_vary on;
    gzip_types text/javascript application/javascript text/css;
    proxy_cache vecta_chat_assets;
    proxy_cache_key "$host|$request_uri";
    proxy_cache_lock on;
    proxy_cache_valid 200 5m;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    # Gateway marks rewritten branding JS no-store. Only public JS/CSS may override it.
    # Live ingress still emits this old public cache-reset cookie on every anonymous asset.
    # Never replay cookies or cache-clearing headers; any other cookie still refuses caching.
    # Upstream always receives no Accept-Encoding; cache its raw representation once.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Clear-Site-Data;
    proxy_hide_header Vary;
    proxy_no_cache $vecta_chat_asset_no_cache $vecta_chat_asset_cookie_no_cache;
    add_header X-Vecta-Asset-Cache $upstream_cache_status always;
}
