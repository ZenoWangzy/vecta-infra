nexus_base_url: "http://127.0.0.1:8081"
nexus_blob_store: default

nexus_npm_proxy_repo: vecta-npm-proxy
nexus_npm_remote_url: "https://registry.npmjs.org"

nexus_pypi_proxy_repo: vecta-pypi-proxy
nexus_pypi_remote_url: "https://pypi.org"

nexus_alpine_proxy_repo: vecta-alpine-proxy
nexus_alpine_remote_url: "https://dl-cdn.alpinelinux.org/alpine"

nexus_debian_proxy_repo: vecta-debian-proxy
nexus_debian_remote_url: "http://deb.debian.org/debian"

nexus_debian_security_proxy_repo: vecta-debian-security-proxy
nexus_debian_security_remote_url: "http://deb.debian.org/debian-security"

# Docker registry — app images use hosted on 8082; daemon mirror uses group on 8083.
nexus_docker_connector_port: 8082
nexus_docker_hosted_connector_port: "{{ nexus_docker_connector_port }}"
nexus_docker_group_connector_port: 8083
nexus_docker_hosted_repo: vecta-docker-local
nexus_docker_proxy_repo: vecta-docker-remote
nexus_ghcr_proxy_repo: vecta-ghcr-remote
nexus_docker_group_repo: vecta-docker-virtual
# Official Docker Hub registry API endpoint for the Nexus Docker proxy.
nexus_docker_remote_index_url: "https://index.docker.io/"
nexus_docker_remote_url: "https://registry-1.docker.io"
# GitHub Container Registry is a distinct OCI registry and must be a separate
# Nexus Docker proxy; Docker Hub cannot serve the OpenClaw runtime base image.
nexus_ghcr_remote_index_url: "https://ghcr.io"
nexus_ghcr_remote_url: "https://ghcr.io"

# Nexus 3.94 uses its System HTTP setting for both HTTP and HTTPS CONNECT.
nexus_outbound_proxy_version: "3.94.0-12"
nexus_outbound_proxy_host: geraldsynnas.ddns.net
nexus_outbound_proxy_port: 8888
nexus_outbound_proxy_non_proxy_hosts:
  - localhost
  - 127.*
  - ::1
nexus_outbound_proxy_password_placeholder: "#~NXRM~PLACEHOLDER~PASSWORD~#"
