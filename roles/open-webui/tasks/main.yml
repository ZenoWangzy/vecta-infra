- name: Require a complete host nginx contract when enabled
  ansible.builtin.assert:
    that:
      - host_nginx_site_name | default('') | length > 0
      - host_nginx_server_names | default([]) | length > 0
      - host_nginx_ssl_certificate | default('') | length > 0
      - host_nginx_ssl_certificate_key | default('') | length > 0
    fail_msg: >-
      host_nginx_enabled requires an explicit site name, server names, and TLS
      certificate paths; no environment default is provided.
  when: host_nginx_enabled | bool

- name: Ensure Open WebUI Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ docker_network }}"
    - "{{ open_webui_network }}"

- name: Ensure Open WebUI nginx config directory
  ansible.builtin.file:
    path: "{{ open_webui_nginx_config_dir }}"
    state: directory
    mode: "0755"

- name: Render Open WebUI proxy nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ open_webui_nginx_config_path }}"
    mode: "0644"
  register: open_webui_nginx_config

# openclaw-open-webui and openclaw-webui-proxy container lifecycle moved to
# mypc:/data/ocee/deploy/open-webui/docker-compose.yml (ticket 145/150, 2026-09-07).
# This role never had a playbook invoking it (no playbooks/*.yml referenced
# `role: open-webui` — confirmed by grepping every playbook in this repo), so
# these two docker_container tasks had never actually run against mypc: the
# image vars below (open_webui_image, open_webui_nginx_image) still disagreed
# with the live containers' actual tags at the time of removal. Reintroducing
# container creation here would fight the compose project for ownership of
# the same container names — do not add it back without also retiring the
# compose project. The nginx CSP templating and DB channel-mapping upsert
# below are still real, still-unwired logic and are unaffected by this
# removal; the compose project bind-mounts the same rendered nginx.conf path.

- name: Probe Open WebUI proxy health
  ansible.builtin.uri:
    url: "{{ open_webui_proxy_health_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: open_webui_proxy_health
  failed_when: false
  changed_when: false

- name: Reload Open WebUI proxy after unhealthy probe
  community.docker.docker_container_exec:
    container: openclaw-webui-proxy
    argv:
      - nginx
      - -s
      - reload
  when: >
    (open_webui_proxy_health.status | default(0) != 200) or
    not (open_webui_proxy_health.json.status | default(false) | bool)

- name: Wait for Open WebUI proxy health
  ansible.builtin.uri:
    url: "{{ open_webui_proxy_health_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: open_webui_proxy_health_ready
  retries: "{{ open_webui_proxy_health_retries }}"
  delay: "{{ open_webui_proxy_health_delay }}"
  until:
    - open_webui_proxy_health_ready.status | default(0) == 200
    - open_webui_proxy_health_ready.json.status | default(false) | bool
  changed_when: false

- name: Ensure Open WebUI channel user mappings
  ansible.builtin.shell: |
    docker exec -i openclaw-postgres psql \
      -U {{ postgres_user | default('openclaw_poc') | quote }} \
      -d {{ postgres_db | default('openclaw_poc') | quote }} \
      -v ON_ERROR_STOP=1 \
      -v employee_id={{ item.employee_id | quote }} \
      -v channel_uid={{ item.channel_uid | default(item.employee_id) | quote }} \
      -tA <<'SQL'
    WITH input AS (
      SELECT :'employee_id'::text AS employee_id,
             :'channel_uid'::text AS channel_uid
    ),
    employee AS (
      SELECT e.employee_id, e.tenant_id, input.channel_uid
        FROM employees e
        CROSS JOIN input
       WHERE lower(e.employee_id) = lower(input.employee_id)
       LIMIT 1
    ),
    updated AS (
      UPDATE channel_user_mapping mapping
         SET employee_id = employee.employee_id,
             status = 'active',
             bound_at = COALESCE(mapping.bound_at, now())
        FROM employee
       WHERE mapping.provider_config_id IS NULL
         AND mapping.channel = 'open-webui'
         AND mapping.tenant_id = employee.tenant_id
         AND lower(mapping.channel_uid) = lower(employee.channel_uid)
         AND (
           mapping.employee_id IS DISTINCT FROM employee.employee_id
           OR mapping.status IS DISTINCT FROM 'active'
         )
       RETURNING 1
    ),
    inserted AS (
      INSERT INTO channel_user_mapping (employee_id, tenant_id, channel, channel_uid, status)
      SELECT employee.employee_id, employee.tenant_id, 'open-webui', employee.channel_uid, 'active'
        FROM employee
      ON CONFLICT DO NOTHING
      RETURNING 1
    )
    SELECT (SELECT count(*) FROM updated) + (SELECT count(*) FROM inserted);
    SQL
  args:
    executable: /bin/bash
  loop: "{{ open_webui_user_mappings }}"
  loop_control:
    label: "{{ item.channel_uid | default(item.employee_id) }}"
  register: open_webui_mapping_upsert
  changed_when: (open_webui_mapping_upsert.stdout | trim | int) > 0
  when: (open_webui_user_mappings | default([]) | length) > 0

- name: Render host nginx site
  become: true
  ansible.builtin.template:
    src: host-nginx-site.conf.j2
    dest: "{{ host_nginx_site_available_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: host_nginx_site
  when: host_nginx_enabled | bool

- name: Enable host nginx site
  become: true
  ansible.builtin.file:
    src: "{{ host_nginx_site_available_path }}"
    dest: "{{ host_nginx_site_enabled_path }}"
    state: link
    force: true
  register: host_nginx_site_link
  when: host_nginx_enabled | bool

- name: Validate host nginx config
  become: true
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false
  when:
    - host_nginx_enabled | bool
    - (host_nginx_site is defined and host_nginx_site.changed | default(false)) or (host_nginx_site_link is defined and host_nginx_site_link.changed | default(false))

- name: Reload host nginx
  become: true
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when:
    - host_nginx_enabled | bool
    - (host_nginx_site is defined and host_nginx_site.changed | default(false)) or (host_nginx_site_link is defined and host_nginx_site_link.changed | default(false))

# kkfileview container lifecycle also moved to the compose project above
# (ticket 145/150). Removed for the same reason as openclaw-open-webui/
# openclaw-webui-proxy: never wired to a playbook, and its declared networks
# ([docker_network, open_webui_network]) actually disagreed with the live
# container, which was only ever attached to docker_network — running this
# task would have silently changed the container's network membership, not
# just its image tag.
#
# onlyoffice's docker_container task is removed outright, not moved to
# compose: the live container carries 5 additional anonymous volumes this
# task never declared (embedded postgres/redis/rabbitmq/fonts/app-data —
# OnlyOffice Document Server bundles its own data services). Recreating it
# from this task's two named volumes alone would silently orphan those 5 and
# start the container with empty internal state. See ticket 145's report for
# the volume-preserving draft and the backup-first verification path before
# anyone attempts a live recreate of this specific container.
