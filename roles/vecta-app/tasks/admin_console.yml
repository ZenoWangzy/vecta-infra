# Ticket 133: this task had no guard at all against admin_console_image being
# a floating/cache-<image-id> tag -- unlike the migration-style task files
# (fleet_gateway_mypc.yml etc.), it pulls and recreates directly off the
# default with nothing else checking the result first.
- name: Refuse floating or pre-provenance admin-console image tags
  ansible.builtin.assert:
    that:
      - "admin_console_image is regex('/admin-console:[0-9a-f]{40}$')"
    fail_msg: >-
      admin_console_image={{ admin_console_image }} is not pinned to a full
      40-character source SHA tag. cache-<image-id> and other floating tags
      are pre-provenance mirrors and must not be deployed (ticket 133). Pass
      -e deploy_image_tags='{"admin-console":"<40-char sha>"}' with a tag
      built from a reviewed commit.
  tags: [always]

- name: Deploy admin-console
  community.docker.docker_container:
    name: openclaw-admin-console
    image: "{{ admin_console_image }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    image_name_mismatch: recreate
    env:
      DATABASE_URL: "postgresql://{{ postgres_user | default('openclaw_poc') }}:{{ postgres_password | default('poc-db-password-change-me') }}@openclaw-postgres:5432/{{ postgres_db | default('openclaw_poc') }}"
      TZ: Asia/Shanghai
    networks:
      - name: "{{ docker_network }}"
    memory: "256m"
    cpus: "0.25"
