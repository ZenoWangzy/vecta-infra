---
# Fleet owns the manager contract for existing per-user runtimes. It is safe to
# replace only the gateway container when its mounts, networks, user, and live
# environment are retained, and no runtime container is recreated.
#
# Ticket 101: Nexus vecta-docker-local still carries 48 fleet-gateway tags
# built before the fail-closed industry-pack guard (ticket 00 /
# IndustryPackIncompatibleError in packages/fleet-gateway/src/hermes/config-generator.ts).
# Those images degrade to zero industry packs instead of refusing to start
# (lesson V23). The judgment is ancestry, not tag shape or age: a tag is safe
# iff fleet_gateway_guard_commit is a git ancestor of it. That commit is the
# root cause fix, not a whitelist of known-good SHAs -- it never goes stale as
# new tags are built after it, unlike a fixed list of "known safe" tags would.
# `/data/ocee` on mypc is a full clone of the vecta repo (origin =
# github.com:ZenoWangzy/vecta) already used for release checkouts, so the
# ancestry check runs against it directly -- no extra clone, no GitHub API
# token. A tag that isn't a real vecta commit (`latest`, `cache-<image-id>`)
# fails to resolve at all, which is refused for the same reason. Full audit,
# including the real-run proof of this check against a fail-open and a
# fail-closed tag, is in vecta's
# docs/ops/2026-09-06-ticket-101-fleet-gateway-tag-audit.md. Refuse before the
# pull/recreate tasks below ever run.
- name: Extract the selected Fleet gateway image's source SHA
  ansible.builtin.set_fact:
    mypc_fleet_gateway_selected_sha: "{{ fleet_gateway_image | regex_replace('^.*:', '') }}"

- name: Fetch the guard commit and the selected tag into the mypc vecta checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ fleet_gateway_source_checkout }}", fetch, origin,
           "{{ fleet_gateway_guard_commit }}", "{{ mypc_fleet_gateway_selected_sha }}"]
  register: mypc_fleet_gateway_guard_fetch
  changed_when: false
  failed_when: false
  check_mode: false

- name: Judge whether the selected Fleet image descends from the ticket 00 guard commit
  ansible.builtin.command:
    argv: [git, -C, "{{ fleet_gateway_source_checkout }}", merge-base, --is-ancestor,
           "{{ fleet_gateway_guard_commit }}", "{{ mypc_fleet_gateway_selected_sha }}"]
  register: mypc_fleet_gateway_guard_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a Fleet gateway image that does not descend from the ticket 00 fail-closed guard
  ansible.builtin.assert:
    that:
      - mypc_fleet_gateway_guard_check.rc == 0
    fail_msg: >-
      fleet_gateway_image={{ fleet_gateway_image }} (sha
      {{ mypc_fleet_gateway_selected_sha }}) does not descend from guard commit
      {{ fleet_gateway_guard_commit }} (the ticket 00 fail-closed industry-pack
      guard). git merge-base --is-ancestor exited
      {{ mypc_fleet_gateway_guard_check.rc }}
      ({{ 'not an ancestor: this is a pre-guard, fail-open image' if mypc_fleet_gateway_guard_check.rc == 1
          else 'could not be resolved in ' + fleet_gateway_source_checkout + ' -- not a real vecta commit (e.g. latest/cache-* tag), or the fetch above failed: ' + (mypc_fleet_gateway_guard_check.stderr | default('')) }}).
      See docs/ops/2026-09-06-ticket-101-fleet-gateway-tag-audit.md in vecta.
  tags: [always]

- name: Capture mypc Fleet gateway contract
  ansible.builtin.command:
    argv: [docker, inspect, "{{ fleet_gateway_container_name }}"]
  register: mypc_fleet_gateway_inspect
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse mypc Fleet gateway contract
  ansible.builtin.set_fact:
    mypc_fleet_gateway_live: "{{ (mypc_fleet_gateway_inspect.stdout | from_json) | first }}"
  no_log: true

- name: Require a running mypc Fleet gateway source container
  ansible.builtin.assert:
    that:
      - mypc_fleet_gateway_live.State.Running | bool
      - mypc_fleet_gateway_live.Config.User == fleet_gateway_user
      - mypc_fleet_gateway_live.Config.Env | length > 0
    fail_msg: "The existing Fleet gateway is not a valid migration source."
  no_log: true

- name: Require the reviewed mypc Fleet mount contract
  ansible.builtin.shell: >-
    set -o pipefail;
    docker inspect {{ fleet_gateway_container_name | quote }} |
    jq -e --arg instances {{ fleet_gateway_instances_host_path | quote }}
    --arg knowledge {{ fleet_gateway_knowledge_host_path | quote }}
    --arg templates {{ fleet_gateway_templates_host_path | quote }}
    --arg plugins {{ fleet_gateway_shared_plugins_host_path | quote }}
    --arg litellm {{ fleet_gateway_litellm_config_host_path | quote }}
    '([.[0].Mounts[] | select(.Source == $instances and .Destination == "/app/data/instances" and .RW)] | length == 1)
    and ([.[0].Mounts[] | select(.Source == $knowledge and .Destination == "/app/knowledge" and .RW)] | length == 1)
    and ([.[0].Mounts[] | select(.Source == $templates and .Destination == "/app/templates" and (.RW | not))] | length == 1)
    and ([.[0].Mounts[] | select(.Source == $plugins and .Destination == "/app/shared-plugins" and (.RW | not))] | length == 1)
    and ([.[0].Mounts[] | select(.Source == $litellm and .Destination == "/app/litellm-config.yaml" and (.RW | not))] | length == 1)
    and ([.[0].Mounts[] | select(.Type == "bind" and .Destination == "/app/industry-packs/fruit")] | length == 0)
    and ([.[0].Mounts[] | select(.Source == "/var/run/docker.sock" and .Destination == "/var/run/docker.sock" and .RW)] | length == 1)'
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Pull the selected Fleet image without changing the live container
  community.docker.docker_image:
    name: "{{ fleet_gateway_image }}"
    source: pull
    force_source: true
    state: present
  no_log: true

- name: Capture current and selected Fleet image identities
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{{ '{{' }}.Id{{ '}}' }}"
      - "{{ mypc_fleet_gateway_live.Image }}"
      - "{{ fleet_gateway_image }}"
  register: mypc_fleet_gateway_image_ids
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the selected Fleet image to match the live image
  ansible.builtin.assert:
    that:
      - mypc_fleet_gateway_image_ids.stdout_lines | length == 2
      - mypc_fleet_gateway_image_ids.stdout_lines[0] == mypc_fleet_gateway_image_ids.stdout_lines[1]
    fail_msg: >-
      The mypc Fleet Gateway image must match the live image ID for this
      configuration-only recreation.

- name: Capture running per-user runtime count before Fleet adoption
  ansible.builtin.shell: >-
    set -o pipefail;
    docker ps -q --filter label=openclaw.enterprise.openclaw-image | wc -l
  args:
    executable: /bin/bash
  register: mypc_fleet_runtime_count_before
  changed_when: false
  check_mode: false

- name: Back up Fleet instance state before Nexus adoption
  ansible.builtin.shell: |
    set -euo pipefail
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    backup_dir="{{ fleet_gateway_backup_root }}/fleet-gateway-nexus-adoption-${stamp}"
    mkdir -p "$backup_dir"
    tar -C {{ fleet_gateway_instances_host_path | quote }} -czf "$backup_dir/instances.tgz" .
    sha256sum "$backup_dir/instances.tgz" > "$backup_dir/checksums.sha256"
    {
      echo "source_image=$(docker inspect -f '{{ '{{' }}.Config.Image{{ '}}' }}' {{ fleet_gateway_container_name | quote }})"
      echo "target_image={{ fleet_gateway_image }}"
      echo "source_image_id={{ mypc_fleet_gateway_image_ids.stdout_lines[0] }}"
      echo "target_image_id={{ mypc_fleet_gateway_image_ids.stdout_lines[1] }}"
      echo "platform_root_employee_ids={{ platform_root_employee_ids | join(',') }}"
      echo "runtime_count_before={{ mypc_fleet_runtime_count_before.stdout | trim }}"
      echo "instances_path={{ fleet_gateway_instances_host_path }}"
    } > "$backup_dir/manifest.txt"
  args:
    executable: /bin/bash
  changed_when: true
  when: not ansible_check_mode

- name: Run Fleet regression before Nexus adoption
  ansible.builtin.script:
    cmd: "{{ role_path }}/../../scripts/mypc-app-regression.sh --service fleet-gateway --phase before"
  changed_when: false
  check_mode: false

- name: Recreate mypc Fleet gateway from the identical Nexus image
  community.docker.docker_container:
    name: "{{ fleet_gateway_container_name }}"
    image: "{{ fleet_gateway_image }}"
    state: started
    pull: true
    image_name_mismatch: recreate
    restart_policy: "{{ fleet_gateway_restart_policy }}"
    user: "{{ fleet_gateway_user }}"
    command: "{{ mypc_fleet_gateway_live.Config.Cmd }}"
    entrypoint: "{{ mypc_fleet_gateway_live.Config.Entrypoint }}"
    env: >-
      {{
        dict(mypc_fleet_gateway_live.Config.Env | map('split', '=', 1))
        | combine({
          'PLATFORM_ROOT_EMPLOYEE_IDS': platform_root_employee_ids | join(','),
        })
      }}
    ports: "{{ fleet_gateway_published_ports }}"
    volumes:
      - "{{ fleet_gateway_instances_host_path }}:/app/data/instances:rw"
      - "{{ fleet_gateway_knowledge_host_path }}:/app/knowledge:rw"
      - "{{ fleet_gateway_templates_host_path }}:/app/templates:ro"
      - "{{ fleet_gateway_shared_plugins_host_path }}:/app/shared-plugins:ro"
      - "{{ fleet_gateway_litellm_config_host_path }}:/app/litellm-config.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
    networks:
      - name: "{{ docker_network }}"
        aliases: "{{ fleet_gateway_network_aliases }}"
      - name: "{{ open_webui_network }}"
        aliases: "{{ fleet_gateway_network_aliases }}"
    networks_cli_compatible: true
    comparisons:
      networks: strict
    log_driver: "{{ fleet_gateway_log_driver }}"
    log_options: "{{ fleet_gateway_log_options }}"
    memory: "{{ fleet_gateway_memory }}"
    cpus: "{{ fleet_gateway_cpus }}"
  no_log: true

- name: Require the same per-user runtime count after Fleet adoption
  ansible.builtin.shell: |
    set -o pipefail
    runtime_count="$(docker ps -q --filter label=openclaw.enterprise.openclaw-image | wc -l)"
    test "$runtime_count" = "{{ mypc_fleet_runtime_count_before.stdout | trim }}"
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode

- name: Run Fleet regression after Nexus adoption
  ansible.builtin.script:
    cmd: "{{ role_path }}/../../scripts/mypc-app-regression.sh --service fleet-gateway --phase after"
  environment:
    EXPECTED_IMAGE: "{{ fleet_gateway_image }}"
    EXPECTED_PLATFORM_ROOT_EMPLOYEE_IDS: "{{ platform_root_employee_ids | join(',') }}"
  changed_when: false
  when: not ansible_check_mode
