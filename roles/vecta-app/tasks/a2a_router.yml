# Ticket 133: this task had no guard at all against a2a_router_image being a
# floating/cache-<image-id> tag -- unlike the migration-style task files
# (fleet_gateway_mypc.yml etc.), it pulls and recreates directly off the
# default with nothing else checking the result first.
- name: Refuse floating or pre-provenance a2a-router image tags
  ansible.builtin.assert:
    that:
      - "a2a_router_image is regex('/a2a-router:[0-9a-f]{40}$')"
    fail_msg: >-
      a2a_router_image={{ a2a_router_image }} is not pinned to a full
      40-character source SHA tag. cache-<image-id> and other floating tags
      are pre-provenance mirrors and must not be deployed (ticket 133). Pass
      -e deploy_image_tags='{"a2a-router":"<40-char sha>"}' with a tag built
      from a reviewed commit.
  tags: [always]

- name: Deploy a2a-router
  community.docker.docker_container:
    name: openclaw-a2a-router
    image: "{{ a2a_router_image }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    image_name_mismatch: recreate
    env:
      A2A_ROUTER_TOKEN: "{{ lookup('env', 'A2A_ROUTER_TOKEN') }}"
      # vecta #408 removed this service's SERVICE_SECRET fallback and made the platform JWT
      # mandatory, fail-closed: without it the process exits at config load with
      # "CHANNEL_PLATFORM_SERVICE_TOKEN is required", never binds 9200, and the deploy then
      # fails at "Wait for a2a-router before fleet-gateway".
      CHANNEL_PLATFORM_SERVICE_TOKEN: "{{ lookup('env', 'CHANNEL_PLATFORM_SERVICE_TOKEN') }}"
      TZ: Asia/Shanghai
    ports:
      - "{{ a2a_router_port | default('9200') }}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:9200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - name: "{{ docker_network }}"
    memory: "256m"
    cpus: "0.25"
  no_log: true
