- name: Deploy a2a-router
  community.docker.docker_container:
    name: openclaw-a2a-router
    image: "{{ a2a_router_image }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    image_name_mismatch: recreate
    env:
      A2A_ROUTER_TOKEN: "{{ lookup('env', 'A2A_ROUTER_TOKEN') }}"
      # vecta #408 removed this service's SERVICE_SECRET fallback and made the platform JWT
      # mandatory, fail-closed: without it the process exits at config load with
      # "CHANNEL_PLATFORM_SERVICE_TOKEN is required", never binds 9200, and the deploy then
      # fails at "Wait for a2a-router before fleet-gateway".
      CHANNEL_PLATFORM_SERVICE_TOKEN: "{{ lookup('env', 'CHANNEL_PLATFORM_SERVICE_TOKEN') }}"
      TZ: Asia/Shanghai
    ports:
      - "{{ a2a_router_port | default('9200') }}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:9200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - name: "{{ docker_network }}"
    memory: "256m"
    cpus: "0.25"
