- name: Create private vtest platform bundle rollback directory
  ansible.builtin.file:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}"
    state: directory
    mode: "0700"

- name: Refuse to overwrite a previous parked platform consumer
  community.docker.docker_container_info:
    name: "openclaw-{{ item.item }}.shared-pool-rollback"
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  register: shared_pool_rollback_containers
  no_log: true

- name: Fail closed on a stale platform consumer rollback container
  ansible.builtin.fail:
    msg: "A stale shared-pool rollback container exists; refusing a mixed cutover"
  loop: "{{ shared_pool_rollback_containers.results | default([]) }}"
  when: item.exists | default(false)

- name: Snapshot old platform consumer environment and image
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect "openclaw-{{ item.item }}" > "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/{{ item.item }}.json"
    chmod 0600 "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/{{ item.item }}.json"
  args:
    executable: /bin/bash
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  no_log: true

- name: Park old platform consumers before the new bundle cutover
  ansible.builtin.command:
    argv:
      - docker
      - rename
      - "openclaw-{{ item.item }}"
      - "openclaw-{{ item.item }}.shared-pool-rollback"
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  register: shared_pool_park_results
  changed_when: true
  no_log: true
