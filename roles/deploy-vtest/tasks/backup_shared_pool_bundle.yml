- name: Park old platform consumers before the new bundle cutover
  ansible.builtin.command:
    argv:
      - docker
      - rename
      - "openclaw-{{ item.item }}"
      - "openclaw-{{ item.item }}.shared-pool-rollback"
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  register: shared_pool_park_results
  changed_when: true
  no_log: true
