- include_role:
    name: search
    apply:
      tags: search
  when: "'search' in ansible_run_tags or 'all' in ansible_run_tags"

- include_role:
    name: open-webui
    apply:
      tags: open-webui
  when: "'open-webui' in ansible_run_tags or 'all' in ansible_run_tags"

- include_role:
    name: openclaw
    apply:
      tags: openclaw
  when: "'openclaw' in ansible_run_tags or 'all' in ansible_run_tags"

- include_role:
    name: vecta-app
    apply:
      tags: vecta-app
  when: "'vecta-app' in ansible_run_tags or 'all' in ansible_run_tags"

- name: Include Fruit vtest role
  ansible.builtin.include_role:
    name: fruit_vtest
    apply:
      tags: fruit-vtest
  tags:
    - fruit-vtest
  when:
    - "'fruit-vtest' in ansible_run_tags or 'all' in ansible_run_tags"
    - fruit_vtest_enabled | default(false) | bool
