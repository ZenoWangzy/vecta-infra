- name: Stop write-capable app containers before migration
  community.docker.docker_container:
    name: "openclaw-{{ item.item }}"
    state: stopped
    stop_timeout: 60
  loop: "{{ vtest_quiesce_containers.results }}"
  when:
    - item.exists | bool
    - item.container.State.Running | default(false) | bool
  register: vtest_quiesce_stop_results
  no_log: true
