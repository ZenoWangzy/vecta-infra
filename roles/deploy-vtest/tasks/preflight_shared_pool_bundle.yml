- name: Refuse a new cutover while a previous shared-pool cleanup is partial
  ansible.builtin.find:
    paths: "{{ remote_dir }}/backups"
    patterns: "shared-pool-partial-cleanup-*"
    file_type: file
    recurse: false
  register: shared_pool_partial_cleanup_markers
  no_log: true

- name: Fail closed on a previous partial shared-pool cleanup
  ansible.builtin.fail:
    msg: "A previous shared-pool cleanup was partial; manual recovery is required before another cutover"
  when: (shared_pool_partial_cleanup_markers.matched | default(0) | int) > 0

- name: Inspect parked rollback consumers before quiesce
  community.docker.docker_container_info:
    name: "openclaw-{{ item }}.shared-pool-rollback"
  loop: "{{ vtest_write_quiesce_services }}"
  register: shared_pool_rollback_containers
  no_log: true

- name: Require every parked rollback inspect result to be explicit
  ansible.builtin.assert:
    that:
      - item.item is defined
      - not (item.failed | default(false) | bool)
      - item.exists is defined
    fail_msg: "Parked rollback inspect evidence is incomplete; refusing a mixed cutover"
  loop: "{{ shared_pool_rollback_containers.results }}"
  no_log: true

- name: Refuse any stale parked platform consumer before quiesce
  ansible.builtin.fail:
    msg: "A stale shared-pool rollback container exists; refusing a mixed cutover"
  loop: "{{ shared_pool_rollback_containers.results }}"
  when: item.exists | bool
  no_log: true

- name: Create the private shared-pool evidence directory before quiesce
  ansible.builtin.file:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}"
    state: directory
    mode: "0700"

- name: Create the dedicated vtest restart manifest directory without changing deploy ownership
  ansible.builtin.file:
    path: "{{ remote_dir }}/deploy/vtest-shared-pool-e2e"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Inspect the dedicated vtest restart manifest directory
  ansible.builtin.stat:
    path: "{{ remote_dir }}/deploy/vtest-shared-pool-e2e"
    follow: false
  register: shared_pool_manifest_dir_stat
  no_log: true

- name: Verify the dedicated vtest restart manifest directory ownership and mode
  ansible.builtin.assert:
    that:
      - shared_pool_manifest_dir_stat.stat.exists | bool
      - shared_pool_manifest_dir_stat.stat.isdir | bool
      - not (shared_pool_manifest_dir_stat.stat.islnk | default(false) | bool)
      - shared_pool_manifest_dir_stat.stat.uid | int == 1000
      - shared_pool_manifest_dir_stat.stat.gid | int == 1000
      - shared_pool_manifest_dir_stat.stat.mode == '0700'
    fail_msg: "The dedicated vtest restart manifest directory is not owned by UID/GID 1000 with mode 0700"
  no_log: true

- name: Verify the dedicated vtest restart manifest directory is writable
  # Explicit sudo instead of become_user: "#1000": ansible's unprivileged-become
  # temp-file ACL (chmod A+user:#1000:rx:allow) is not supported on this
  # filesystem and fails the task before the check even runs.
  ansible.builtin.command:
    argv:
      - sudo
      - -n
      - -u
      - "#1000"
      - test
      - -w
      - "{{ remote_dir }}/deploy/vtest-shared-pool-e2e"
  register: shared_pool_manifest_dir_writable
  changed_when: false
  no_log: true

- name: Require the dedicated vtest restart manifest directory to be writable
  ansible.builtin.assert:
    that:
      - shared_pool_manifest_dir_writable.rc | int == 0
    fail_msg: "UID 1000 cannot write the dedicated vtest restart manifest directory"
  no_log: true

- name: Snapshot old platform consumer environment and image atomically before quiesce
  ansible.builtin.shell: |
    set -euo pipefail
    target="{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/{{ item.item }}.json"
    temp="${target}.tmp.$$"
    trap 'rm -f -- "$temp"' EXIT
    if [ -e "$target" ] || [ -L "$target" ]; then
      echo "shared-pool snapshot already exists" >&2
      exit 1
    fi
    docker inspect "openclaw-{{ item.item }}" > "$temp"
    chmod 0600 "$temp"
    node --input-type=module - "$temp" <<'NODE'
    import { readFileSync } from 'node:fs';
    const path = process.argv[2];
    const value = JSON.parse(readFileSync(path, 'utf8'));
    if (!Array.isArray(value) || value.length !== 1) throw new Error('snapshot_shape');
    const container = value[0];
    if (typeof container.Id !== 'string' || !container.Id) throw new Error('snapshot_id');
    if (typeof container.Name !== 'string' || !container.Name) throw new Error('snapshot_name');
    if (typeof container.Config?.Image !== 'string' || !container.Config.Image) throw new Error('snapshot_image');
    if (!Array.isArray(container.Config?.Env)) throw new Error('snapshot_env');
    if (typeof container.State?.Running !== 'boolean') throw new Error('snapshot_running');
    NODE
    mv -- "$temp" "$target"
    trap - EXIT
  args:
    executable: /bin/bash
  loop: "{{ vtest_quiesce_containers.results }}"
  when: item.exists | bool
  no_log: true

- name: Verify every pre-quiesce snapshot is complete and private
  ansible.builtin.stat:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/{{ item.item }}.json"
    follow: false
  loop: "{{ vtest_quiesce_containers.results }}"
  when: item.exists | bool
  register: shared_pool_pre_quiesce_snapshot_stats
  no_log: true

- name: Refuse quiesce without complete old consumer snapshots
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - not (item.stat.islnk | default(false) | bool)
      - item.stat.mode | default('') == '0600'
      - item.stat.size | default(0) | int > 0
    fail_msg: "A pre-quiesce shared-pool snapshot is incomplete or unsafe"
  loop: "{{ shared_pool_pre_quiesce_snapshot_stats.results | default([]) }}"
  no_log: true
