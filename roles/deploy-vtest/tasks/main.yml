- import_tasks: preflight.yml
  tags:
    - vecta-app
    - fruit-vtest
- block:
    - import_tasks: audit_start.yml
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: quiesce.yml
      when: >-
        (vtest_allow_migrate | string == '1')
        or (('vtest' in group_names) and (shared_pool_vtest_fixture_enabled | default(false) | bool))
      tags: vecta-app
    - import_tasks: backup.yml
      when: >-
        (vtest_allow_migrate | string == '1')
        or (fruit_vtest_bootstrap | default(false) | bool)
        or (('vtest' in group_names) and (shared_pool_vtest_fixture_enabled | default(false) | bool))
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: backup_shared_pool_bundle.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
      tags: vecta-app
    - import_tasks: migrate.yml
      when: vtest_allow_migrate | string == '1'
      tags: vecta-app
    - import_tasks: shared_pool_fixture.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
      tags: vecta-app
    - import_tasks: deploy.yml
      tags: always
    - import_tasks: smoke.yml
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: shared_pool_restart_probe.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
        - lookup('env', 'VTEST_SHARED_POOL_RESTART_PROBE') | string == '1'
      tags: shared-pool-restart-probe
    - import_tasks: cleanup_shared_pool_bundle.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
      tags: vecta-app
    - name: Mark the shared-pool cutover complete after rollback cleanup succeeds
      ansible.builtin.set_fact:
        shared_pool_cutover_complete: true
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
      tags: always
    - import_tasks: audit_success.yml
      tags:
        - vecta-app
        - fruit-vtest
  rescue:
    - import_tasks: rollback_shared_pool_bundle.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
        - not (shared_pool_cutover_committed | default(false) | bool)
      tags: always
    - name: Record partial parked cleanup after the irreversible commit point
      ansible.builtin.copy:
        content: "shared_pool_cleanup=partial\nnew_bundle=keep_running\nrollback=forbidden\n"
        dest: "{{ remote_dir }}/backups/shared-pool-partial-cleanup-{{ deploy_sha }}"
        mode: "0600"
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
        - shared_pool_cutover_committed | default(false) | bool
      no_log: true
      tags: always
    - name: Fail closed after partial parked cleanup without rolling back the new bundle
      ansible.builtin.fail:
        msg: "Shared-pool cleanup crossed its irreversible commit point and was partial; new bundle remains running and rollback is forbidden"
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
        - shared_pool_cutover_committed | default(false) | bool
      tags: always
    - name: Restore write-capable app containers after failed deploy
      community.docker.docker_container:
        name: "openclaw-{{ item.item }}"
        state: started
      loop: "{{ vtest_quiesce_containers.results | default([]) }}"
      when:
        - not (('vtest' in group_names) and (shared_pool_vtest_fixture_enabled | default(false) | bool))
        - item.exists | default(false)
        - item.container.State.Running | default(false)
      register: vtest_quiesce_restore
      ignore_errors: true
      no_log: true
      tags: always
    - import_tasks: audit_failure.yml
      tags: always
    - name: Fail if quiesced services could not be restored
      fail:
        msg: "Deploy failed and one or more quiesced services could not be restored"
      when: vtest_quiesce_restore is failed
      tags: always
    - fail:
        msg: "Deploy failed — failure audit written"
      tags: always
