- import_tasks: preflight.yml
  tags:
    - vecta-app
    - fruit-vtest
- block:
    - import_tasks: audit_start.yml
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: quiesce.yml
      when: >-
        (vtest_allow_migrate | string == '1')
        or (('vtest' in group_names) and (shared_pool_vtest_fixture_enabled | default(false) | bool))
      tags: vecta-app
    - import_tasks: backup.yml
      when: >-
        (vtest_allow_migrate | string == '1')
        or (fruit_vtest_bootstrap | default(false) | bool)
        or (('vtest' in group_names) and (shared_pool_vtest_fixture_enabled | default(false) | bool))
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: migrate.yml
      when: vtest_allow_migrate | string == '1'
      tags: vecta-app
    - import_tasks: shared_pool_fixture.yml
      when:
        - "'vtest' in group_names"
        - shared_pool_vtest_fixture_enabled | default(false) | bool
      tags: vecta-app
    - import_tasks: deploy.yml
      tags: always
    - import_tasks: smoke.yml
      tags:
        - vecta-app
        - fruit-vtest
    - import_tasks: audit_success.yml
      tags:
        - vecta-app
        - fruit-vtest
  rescue:
    - name: Restore write-capable app containers after failed deploy
      community.docker.docker_container:
        name: "openclaw-{{ item.item }}"
        state: started
      loop: "{{ vtest_quiesce_containers.results | default([]) }}"
      when:
        - item.exists | default(false)
        - item.container.State.Running | default(false)
      register: vtest_quiesce_restore
      ignore_errors: true
      no_log: true
      tags: always
    - import_tasks: audit_failure.yml
      tags: always
    - name: Fail if quiesced services could not be restored
      fail:
        msg: "Deploy failed and one or more quiesced services could not be restored"
      when: vtest_quiesce_restore is failed
      tags: always
    - fail:
        msg: "Deploy failed — failure audit written"
      tags: always
