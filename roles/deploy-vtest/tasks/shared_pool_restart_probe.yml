- name: Shared-pool restart probe — require the guarded vtest fixture lane
  ansible.builtin.assert:
    that:
      - "'vtest' in group_names"
      - shared_pool_vtest_fixture_enabled | default(false) | bool
      - shared_pool_vtest_fixture_tenant_id | default('') == 'vtest-shared-pool'
      - lookup('env', 'VTEST_SHARED_POOL_RESTART_PROBE') | string == '1'
    fail_msg: "The shared-pool restart probe is restricted to the enabled vtest fixture lane"
  no_log: true

- name: Shared-pool restart probe — require the fixed Fleet pre marker
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - openclaw-fleet-gateway
      - test
      - -f
      - /app/data/instances/.shared-pool-restart-pre
  register: shared_pool_restart_probe_marker
  changed_when: false
  no_log: true

- name: Shared-pool restart probe — query the authoritative fixture lease state
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec openclaw-postgres psql \
      -X \
      -q \
      -v ON_ERROR_STOP=1 \
      -U {{ postgres_user | default('openclaw') | quote }} \
      -d {{ postgres_db | default('openclaw') | quote }} \
      -Atc \
      "BEGIN;
       DO \$context\$
       BEGIN
         PERFORM set_config('app.current_tenant', '__auth__', true);
       END
       \$context\$;
       DO \$guard\$
       BEGIN
         IF to_regclass('public.shared_pool_slots') IS NULL
            OR to_regclass('public.shared_pool_lease_requests') IS NULL THEN
           RAISE EXCEPTION 'shared_pool_authority_schema_missing';
         END IF;
         IF EXISTS (
           SELECT 1
           FROM (VALUES
             ('shared_pool_slots', 'status'),
             ('shared_pool_slots', 'lease_tenant_id'),
             ('shared_pool_slots', 'finalizing_at'),
             ('shared_pool_slots', 'slot_id'),
             ('shared_pool_slots', 'generation'),
             ('shared_pool_lease_requests', 'tenant_id'),
             ('shared_pool_lease_requests', 'released_at'),
             ('shared_pool_lease_requests', 'slot_id'),
             ('shared_pool_lease_requests', 'generation')
           ) AS required(table_name, column_name)
           WHERE NOT EXISTS (
             SELECT 1
             FROM information_schema.columns column_info
             WHERE column_info.table_schema = 'public'
               AND column_info.table_name = required.table_name
               AND column_info.column_name = required.column_name
           )
         ) THEN
           RAISE EXCEPTION 'shared_pool_authority_columns_missing';
         END IF;
       END
       \$guard\$;
       SELECT CASE WHEN EXISTS (
         SELECT 1
         FROM public.shared_pool_slots slot
         WHERE slot.lease_tenant_id = 'vtest-shared-pool'
           AND (
             slot.status::text IN ('leased', 'provisioning')
             OR slot.finalizing_at IS NOT NULL
           )
       ) OR EXISTS (
         SELECT 1
         FROM public.shared_pool_lease_requests request
         WHERE request.tenant_id = 'vtest-shared-pool'
           AND request.released_at IS NULL
       ) THEN 1 ELSE 0 END;
       COMMIT;"
  args:
    executable: /bin/bash
  register: shared_pool_restart_probe_active_leases
  changed_when: false
  no_log: true

- name: Shared-pool restart probe — fail closed on an active or incomplete fixture lease
  ansible.builtin.assert:
    that:
      - shared_pool_restart_probe_marker.rc | int == 0
      - shared_pool_restart_probe_active_leases.rc | int == 0
      - shared_pool_restart_probe_active_leases.stdout | trim == '0'
    fail_msg: "The restart probe requires the fixed pre marker and no fixture leased/finalizing/provisioning or unreleased request state"
  no_log: true

- name: Shared-pool restart probe — remove Fleet without application-side restart
  community.docker.docker_container:
    name: openclaw-fleet-gateway
    state: absent
    force_kill: true
  no_log: true
  tags: shared-pool-restart-probe

- name: Shared-pool restart probe — recreate Fleet from the current platform bundle
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../vecta-app/tasks/fleet_gateway.yml"
    apply:
      tags:
        - shared-pool-restart-probe
  tags: shared-pool-restart-probe

- name: Shared-pool restart probe — wait for the recreated Fleet health port
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ fleet_port | default(3000) }}"
    timeout: 60
  no_log: true

- name: Shared-pool restart probe — run the fixed Fleet runner post phase
  community.docker.docker_container_exec:
    container: openclaw-fleet-gateway
    argv:
      - node
      - /app/packages/fleet-gateway/dist/vtest/shared-pool-e2e.js
      - --restart-post
  register: shared_pool_restart_probe_post_result
  changed_when: false
  no_log: true
  tags: shared-pool-restart-probe
