- name: Assert the vtest shared-pool fixture identity is fixed
  ansible.builtin.assert:
    that:
      - shared_pool_vtest_fixture_tenant_id | default('') == 'vtest-shared-pool'
    fail_msg: "The vtest shared-pool fixture tenant id is immutable"

- name: Initialize and audit the vtest shared-pool fixture tenant
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -i openclaw-postgres psql \
      -X \
      -v ON_ERROR_STOP=1 \
      -U {{ postgres_user | default('openclaw') | quote }} \
      -d {{ postgres_db | default('openclaw') | quote }} <<'SQL'
    BEGIN;
    SELECT pg_advisory_xact_lock(hashtextextended('vtest-shared-pool', 0));
    SELECT set_config('app.current_tenant', '__auth__', true);

    DO $fixture$
    DECLARE
      fixture_marker TEXT;
    BEGIN
      IF to_regclass('public.tenants') IS NULL THEN
        RAISE EXCEPTION 'shared pool fixture requires public.tenants';
      END IF;
      IF NOT EXISTS (
        SELECT 1
          FROM information_schema.columns
         WHERE table_schema = 'public'
           AND table_name = 'tenants'
           AND column_name IN ('config', 'status')
         GROUP BY table_schema, table_name
        HAVING count(*) = 2
      ) THEN
        RAISE EXCEPTION 'shared pool fixture requires tenants.config and tenants.status';
      END IF;
      IF to_regclass('public.audit_log') IS NULL THEN
        RAISE EXCEPTION 'shared pool fixture requires public.audit_log for audit evidence';
      END IF;
      IF NOT EXISTS (
        SELECT 1
          FROM information_schema.columns
         WHERE table_schema = 'public'
           AND table_name = 'audit_log'
           AND column_name = 'tenant_id'
      ) THEN
        RAISE EXCEPTION 'shared pool fixture requires audit_log.tenant_id';
      END IF;
      IF NOT EXISTS (
        SELECT 1
          FROM pg_class
         WHERE oid = 'public.audit_log'::regclass
           AND relrowsecurity
           AND relforcerowsecurity
      ) THEN
        RAISE EXCEPTION 'shared pool fixture requires audit_log FORCE ROW LEVEL SECURITY';
      END IF;

      SELECT COALESCE(config->>'vtest_shared_pool_fixture', '')
        INTO fixture_marker
        FROM public.tenants
       WHERE id = 'vtest-shared-pool'
       FOR UPDATE;

      IF NOT FOUND THEN
        INSERT INTO public.tenants (id, name, tier, config, status)
        VALUES (
          'vtest-shared-pool',
          'vtest shared pool fixture',
          'free',
          jsonb_build_object('vtest_shared_pool_fixture', true, 'fixture_version', 1),
          'active'
        );
      ELSIF fixture_marker <> 'true' THEN
        RAISE EXCEPTION 'refusing to repurpose an unmarked tenant with fixture id';
      ELSE
        UPDATE public.tenants
           SET tier = 'free',
               status = 'active',
               config = COALESCE(config, '{}'::jsonb)
                 || jsonb_build_object('vtest_shared_pool_fixture', true, 'fixture_version', 1)
         WHERE id = 'vtest-shared-pool'
           AND config->>'vtest_shared_pool_fixture' = 'true';
      END IF;

      IF NOT EXISTS (
        SELECT 1
          FROM public.tenants
         WHERE id = 'vtest-shared-pool'
           AND tier = 'free'
           AND status = 'active'
           AND config->>'vtest_shared_pool_fixture' = 'true'
      ) THEN
        RAISE EXCEPTION 'shared pool fixture verification failed';
      END IF;

      INSERT INTO public.audit_log (event_type, resource, tenant_id, severity, payload, created_at)
      VALUES (
        'vtest.shared_pool_fixture_initialized',
        'shared-pool',
        'vtest-shared-pool',
        'info',
        jsonb_build_object('fixture_tenant_id', 'vtest-shared-pool', 'fixture_version', 1),
        now()
      );
    END
    $fixture$;
    COMMIT;
    SQL
    echo SHARED_POOL_FIXTURE_READY
  args:
    executable: /bin/bash
  register: shared_pool_fixture_result
  changed_when: "'SHARED_POOL_FIXTURE_READY' in shared_pool_fixture_result.stdout"
  no_log: true
