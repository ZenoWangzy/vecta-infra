- name: Create backups directory
  file:
    path: "{{ remote_dir }}/backups"
    state: directory
    mode: "0755"

- name: Backup vtest DB before any migrate
  shell: |
    set -euo pipefail
    backup_connection_user={{ postgres_user | default('openclaw_poc') | quote }}
    backup_database={{ postgres_db | default('openclaw_poc') | quote }}
    backup_user="$(
      docker exec openclaw-postgres psql \
        -X -U "$backup_connection_user" -d "$backup_database" \
        -v ON_ERROR_STOP=1 -Atc \
        'SELECT rolname
           FROM pg_catalog.pg_roles
          WHERE rolsuper AND rolcanlogin
          ORDER BY (rolname = current_user) DESC, rolname
          LIMIT 1'
    )"
    [ -n "$backup_user" ] || {
      echo "No login-capable PostgreSQL superuser is available for a complete backup" >&2
      exit 1
    }
    docker exec openclaw-postgres pg_dump \
      -U "$backup_user" \
      -d "$backup_database" \
      > {{ remote_dir }}/backups/vtest-$(date -u +%Y%m%dT%H%M%SZ).sql \
      && echo BACKUP_OK
  args:
    executable: /bin/bash
  register: backup_result
  changed_when: "'BACKUP_OK' in backup_result.stdout"

- name: Fail if backup did not complete
  fail:
    msg: "DB backup did not produce BACKUP_OK — aborting"
  when: "'BACKUP_OK' not in backup_result.stdout"
