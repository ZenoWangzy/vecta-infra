- name: Require complete quiesce evidence before any parked cleanup
  ansible.builtin.assert:
    that:
      - vtest_quiesce_containers is defined
      - vtest_quiesce_containers.results is defined
      - (vtest_quiesce_containers.results | length) == (vtest_write_quiesce_services | length)
      - (vtest_quiesce_containers.results | map(attribute='item') | list | sort) == (vtest_write_quiesce_services | sort)
    fail_msg: "Quiesce evidence is incomplete; refusing all parked cleanup"
  no_log: true

- name: Require every quiesce result to be explicit before any parked cleanup
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.item is defined
      - not (item.failed | default(false) | bool)
      - item.exists is defined
      - (not (item.exists | bool)) or (item.container is defined and item.container.Id is defined and item.container.Config.Env is defined and item.container.State is defined and item.container.State.Running is defined)
    fail_msg: "Quiesce evidence is missing or failed; unknown is not treated as nonexistent"
  loop: "{{ vtest_quiesce_containers.results }}"
  no_log: true

- name: Validate every new platform consumer is healthy before the irreversible cleanup point
  community.docker.docker_container_info:
    name: "openclaw-{{ item }}"
  loop: "{{ vtest_write_quiesce_services }}"
  register: shared_pool_new_bundle_containers
  no_log: true

- name: Require a complete healthy new platform consumer set
  ansible.builtin.assert:
    that:
      - (shared_pool_new_bundle_containers.results | length) == (vtest_write_quiesce_services | length)
      - (shared_pool_new_bundle_containers.results | map(attribute='item') | list | sort) == (vtest_write_quiesce_services | sort)
    fail_msg: "New shared-pool platform consumer evidence is incomplete; refusing irreversible cleanup"
  no_log: true

- name: Require every new platform consumer to be running before cleanup
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false) | bool)
      - item.exists | default(false) | bool
      - item.container.Id is defined
      - item.container.State.Running | default(false) | bool
    fail_msg: "A new shared-pool platform consumer is not healthy; refusing irreversible cleanup"
  loop: "{{ shared_pool_new_bundle_containers.results }}"
  loop_control:
    label: "{{ item.item }}"
  # no_log lifted temporarily for diagnosis: assert output names only the service item, no secrets


- name: Verify every parked old consumer and snapshot before the cleanup commit point
  community.docker.docker_container_info:
    name: "openclaw-{{ item.item }}.shared-pool-rollback"
  loop: "{{ vtest_quiesce_containers.results }}"
  when: item.exists | bool
  register: shared_pool_parked_before_cleanup
  no_log: true

- name: Require every parked old consumer to remain recoverable
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false) | bool)
      - item.exists | default(false) | bool
      - item.container.Id is defined
    fail_msg: "A parked old consumer is missing; refusing irreversible cleanup"
  loop: "{{ shared_pool_parked_before_cleanup.results | default([]) }}"
  no_log: true

- name: Verify parked old consumer environment snapshots before cleanup
  ansible.builtin.stat:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/{{ item.item }}.json"
  loop: "{{ vtest_quiesce_containers.results }}"
  when: item.exists | bool
  register: shared_pool_cleanup_snapshot_stats
  no_log: true

- name: Refuse cleanup without complete parked snapshots
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.size | default(0) | int > 0
    fail_msg: "A parked old consumer snapshot is incomplete; refusing irreversible cleanup"
  loop: "{{ shared_pool_cleanup_snapshot_stats.results | default([]) }}"
  no_log: true

- name: Record the irreversible shared-pool cleanup commit point
  ansible.builtin.copy:
    content: "shared_pool_cutover=committed\n"
    dest: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}/CUTOVER_COMMITTED"
    mode: "0600"

- name: Mark the shared-pool cutover committed before deleting parked evidence
  ansible.builtin.set_fact:
    shared_pool_cutover_committed: true

- name: Remove old platform consumers after the complete vtest cutover
  community.docker.docker_container:
    name: "openclaw-{{ item.item }}.shared-pool-rollback"
    state: absent
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  no_log: true

- name: Refuse cleanup success while a parked rollback container remains
  community.docker.docker_container_info:
    name: "openclaw-{{ item }}.shared-pool-rollback"
  loop: "{{ vtest_write_quiesce_services }}"
  register: shared_pool_parked_rollback_containers
  no_log: true

- name: Fail closed on a parked rollback container
  ansible.builtin.assert:
    that:
      - not (item.exists | default(false) | bool)
    fail_msg: "A parked shared-pool rollback container remains after cleanup"
  loop: "{{ shared_pool_parked_rollback_containers.results | default([]) }}"
  no_log: true

- name: Remove the private old-bundle rollback snapshot after success
  ansible.builtin.file:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}"
    state: absent
