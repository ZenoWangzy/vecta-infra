- name: Remove old platform consumers after the complete vtest cutover
  community.docker.docker_container:
    name: "openclaw-{{ item.item }}.shared-pool-rollback"
    state: absent
  loop: "{{ vtest_quiesce_containers.results | default([]) }}"
  when: item.exists | default(false)
  no_log: true

- name: Refuse cleanup success while a parked rollback container remains
  community.docker.docker_container_info:
    name: "openclaw-{{ item }}.shared-pool-rollback"
  loop: "{{ vtest_write_quiesce_services }}"
  register: shared_pool_parked_rollback_containers
  no_log: true

- name: Fail closed on a parked rollback container
  ansible.builtin.assert:
    that:
      - not (item.exists | default(false) | bool)
    fail_msg: "A parked shared-pool rollback container remains after cleanup"
  loop: "{{ shared_pool_parked_rollback_containers.results | default([]) }}"
  no_log: true

- name: Remove the private old-bundle rollback snapshot after success
  ansible.builtin.file:
    path: "{{ remote_dir }}/backups/shared-pool-platform-bundle-{{ deploy_sha }}"
    state: absent
