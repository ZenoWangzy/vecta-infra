---
# Repository-writer-initiated production build evidence. It builds the current
# VectA main HEAD into the production-local Nexus on the mypc runner only.
name: Build mypc production images

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        description: >-
          Full 40-character current VectA main HEAD SHA
      source_branch:
        type: choice
        required: true
        default: main
        description: >-
          VectA branch whose current HEAD is built; only main is accepted.
        options:
          - main
      docker_cache_prune_until:
        type: string
        default: 48h
        description: >-
          Docker build-cache retention on the mypc runner; set to 'never'
          to skip
      image_names:
        type: string
        required: false
        default: ""
        description: >-
          Comma-separated subset of contract images to build; empty builds all.

permissions:
  contents: read

concurrency:
  group: mypc-production-build-v2
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'ZenoWangzy/vecta-infra' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mypc, prod-build]
    environment: production
    timeout-minutes: 240
    defaults:
      run:
        working-directory: infra
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_NO_REPLACE_OBJECTS: "1"
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      NEXUS_DOCKER_REGISTRY: 127.0.0.1:8082
      DOCKER_BASE_IMAGE_REGISTRY: 127.0.0.1:8082
      DOCKER_BASE_IMAGE_SOURCE_REGISTRY: 127.0.0.1:8083
      NPM_REGISTRY: http://127.0.0.1:8081/repository/vecta-npm-proxy/
      NPM_CONFIG_REGISTRY: http://127.0.0.1:8081/repository/vecta-npm-proxy/
      PIP_INDEX_URL: >-
        http://127.0.0.1:8081/repository/vecta-pypi-proxy/simple/
      ALPINE_MIRROR: http://127.0.0.1:8081/repository/vecta-alpine-proxy
      DEBIAN_MIRROR: http://127.0.0.1:8081/repository/vecta-debian-proxy
      DEBIAN_SECURITY_MIRROR: >-
        http://127.0.0.1:8081/repository/vecta-debian-security-proxy
      DOCKER_BUILDKIT: "0"
      BUILDX_VERSION: v0.34.1
      BUILDX_LINUX_AMD64_SHA256: f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b
      BUILDX_PLUGIN_PATH: /usr/local/lib/docker/cli-plugins/docker-buildx
      PRODUCTION_IMAGE_NAMES: ${{ inputs.image_names || '' }}
      DOCKER_CACHE_PRUNE_UNTIL: ${{ inputs.docker_cache_prune_until }}
      NEXUS_ADMIN_PASSWORD_SECRET_NAME: MYPC_NEXUS_ADMIN_PASSWORD
    steps:
      - name: Checkout infra contract
        working-directory: .
        run: |
          set -euo pipefail
          [ -n "${INFRA_READ_TOKEN:-}" ] || {
            echo "github.token is required" >&2
            exit 1
          }
          if ! printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "GITHUB_SHA must be a full lowercase Git SHA" >&2
            exit 1
          fi
          [ "$PWD" = "$GITHUB_WORKSPACE" ] || {
            echo "infra checkout must run at GITHUB_WORKSPACE" >&2
            exit 1
          }
          target="$GITHUB_WORKSPACE/infra"
          old_objects="$GITHUB_WORKSPACE/.git/objects"
          rm -rf "$target"
          git init "$target"
          git -C "$target" remote add origin \
            https://github.com/ZenoWangzy/vecta-infra.git
          if [ -d "$old_objects" ] \
            && GIT_ALTERNATE_OBJECT_DIRECTORIES="$old_objects" \
              git -C "$target" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            GIT_ALTERNATE_OBJECT_DIRECTORIES="$old_objects" \
              git -C "$target" update-ref refs/remotes/origin/main "$GITHUB_SHA"
            printf '%s\n' "$GITHUB_SHA" > "$target/.git/shallow"
            GIT_ALTERNATE_OBJECT_DIRECTORIES="$old_objects" \
              git -C "$target" repack -a -d
          fi
          if ! git -C "$target" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            askpass="$(mktemp)"
            trap 'rm -f "$askpass"' EXIT
            chmod 700 "$askpass"
            cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$INFRA_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
            command -v timeout >/dev/null || {
              echo "timeout is required" >&2
              exit 1
            }
            # ponytail: exact local object avoids GitHub; fetch only on a cold runner.
            for attempt in 1 2 3; do
              if GIT_HTTP_LOW_SPEED_LIMIT=0 \
                LC_ALL=C \
                GIT_ASKPASS="$askpass" \
                GIT_ASKPASS_REQUIRE=force \
                GIT_TERMINAL_PROMPT=0 \
                timeout 10m git -C "$target" fetch --depth=1 origin \
                  "+$GITHUB_SHA:refs/remotes/origin/main"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "infra fetch failed after 3 attempts" >&2
                exit 1
              fi
              echo "Retrying infra fetch after transient network failure"
            done
          fi
          git -C "$target" fsck --connectivity-only "$GITHUB_SHA"
          git -C "$target" checkout --detach --force "$GITHUB_SHA"
          test "$(git -C "$target" rev-parse HEAD)" = "$GITHUB_SHA"
          if git -C "$target" symbolic-ref -q HEAD >/dev/null; then
            echo "infra checkout must be detached" >&2
            exit 1
          fi
          if [ -n "$(git -C "$target" status --porcelain --untracked-files=all)" ]; then
            echo "infra checkout must be clean" >&2
            exit 1
          fi
        env:
          INFRA_READ_TOKEN: ${{ github.token }}

      - name: Validate selected SHA
        run: |
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full 40-character lowercase Git SHA" >&2
            exit 1
          fi

      - name: Validate Docker cache retention
        run: |
          set -euo pipefail
          if ! printf '%s' "$DOCKER_CACHE_PRUNE_UNTIL" \
            | grep -Eq '^(never|[1-9][0-9]*[smhd])$'; then
            echo "docker_cache_prune_until must be never or a positive duration" >&2
            exit 1
          fi

      - name: Download selected VectA source
        run: |
          set -euo pipefail
          [ -n "${VECTA_READ_TOKEN:-}" ] || {
            echo "VECTA_READ_TOKEN secret is required" >&2
            exit 1
          }
          case "$SOURCE_BRANCH" in
            main) ;;
            *) echo "source_branch must be main: $SOURCE_BRANCH" >&2; exit 1 ;;
          esac
          curl_config="$(mktemp)"
          askpass="$(mktemp)"
          trap 'rm -f "$curl_config" "$askpass"' EXIT
          chmod 600 "$curl_config"
          chmod 700 "$askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$VECTA_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          {
            printf 'header = "Authorization: Bearer %s"\n' "$VECTA_READ_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'retry = 5\nretry-delay = 5\nconnect-timeout = 30\n'
            printf 'speed-limit = 10240\nspeed-time = 60\n'
          } > "$curl_config"
          branch_json="$(curl -fsSL --config "$curl_config" \
            "https://api.github.com/repos/ZenoWangzy/vecta/git/ref/heads/main")"
          branch_sha="$(printf '%s' "$branch_json" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const ref = JSON.parse(input);
              process.stdout.write(ref.object.sha);
            });
          ')"
          if [ "$branch_sha" != "$SOURCE_SHA" ]; then
            echo "source_sha must be the current VectA main HEAD" >&2
            echo "expected=$SOURCE_SHA actual=$branch_sha" >&2
            exit 1
          fi
          [ ! -e vecta ] || {
            echo "vecta source directory must not exist before clone" >&2
            exit 1
          }
          command -v timeout >/dev/null || {
            echo "timeout is required" >&2
            exit 1
          }
          # ponytail: 30m absolute cap; add a progress watchdog only if a
          # successful exact-source clone exceeds it.
          # ponytail: three attempts cover the observed transient disconnect;
          # use a resumable source transport only if all three still fail.
          remote="https://github.com/ZenoWangzy/vecta.git"
          cache="/home/github-runner/.cache/vecta-main.git"
          clone_source() {
            GIT_HTTP_LOW_SPEED_LIMIT=0 \
              LC_ALL=C \
              GIT_ASKPASS="$askpass" \
              GIT_ASKPASS_REQUIRE=force \
              GIT_TERMINAL_PROMPT=0 \
              timeout 30m git clone --depth=1 --branch main --single-branch \
                "$1" vecta
          }
          cloned=false
          if [ -d "$cache" ] \
            && git --git-dir="$cache" cat-file -e "$SOURCE_SHA^{commit}" \
            && [ "$(git --git-dir="$cache" rev-parse refs/heads/main)" \
              = "$SOURCE_SHA" ] \
            && git --git-dir="$cache" fsck --connectivity-only "$SOURCE_SHA" \
              >/dev/null 2>&1; then
            if clone_source "$cache"; then
              cloned=true
              echo "Using cached exact VectA source"
            else
              rm -rf vecta
              echo "Cached VectA source unusable; falling back to GitHub"
            fi
          fi
          if [ "$cloned" = false ]; then
            for attempt in 1 2 3; do
              if clone_source "$remote"; then
                cloned=true
                break
              fi
              rm -rf vecta
              if [ "$attempt" -eq 3 ]; then
                echo "VectA clone failed after 3 attempts" >&2
                exit 1
              fi
              echo "Retrying VectA clone after transient network failure"
            done
          fi
          test "$cloned" = true
          git -C vecta switch --detach "$SOURCE_SHA"
          checkout_sha="$(git -C vecta rev-parse HEAD)"
          if [ "$checkout_sha" != "$SOURCE_SHA" ]; then
            echo "cloned VectA checkout does not match source_sha" >&2
            exit 1
          fi
          if [ -n "$(git -C vecta status --porcelain --untracked-files=all)" ]; then
            echo "cloned VectA checkout must be clean" >&2
            exit 1
          fi
        env:
          VECTA_READ_TOKEN: ${{ secrets.VECTA_READ_TOKEN }}

      - name: Preflight production build runner
        run: |
          set -euo pipefail
          command -v docker >/dev/null || {
            echo "docker is required" >&2; exit 1;
          }
          docker compose version >/dev/null || {
            echo "docker compose is required" >&2; exit 1;
          }
          command -v python3 >/dev/null || {
            echo "python3 is required" >&2; exit 1;
          }
          command -v node >/dev/null || {
            echo "node is required" >&2; exit 1;
          }
          command -v pnpm >/dev/null || {
            echo "pnpm is required" >&2; exit 1;
          }
          command -v nice >/dev/null || {
            echo "nice is required" >&2; exit 1;
          }
          command -v ionice >/dev/null || {
            echo "ionice is required" >&2; exit 1;
          }
          command -v sha256sum >/dev/null || {
            echo "sha256sum is required" >&2; exit 1;
          }
          available_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 62914560 ]; then
            echo "at least 60GiB free disk is required" >&2
            exit 1
          fi

      - name: Require exact-SHA VectA Postsubmit evidence
        run: >-
          python3 scripts/verify-vecta-postsubmit.py
          --repo ZenoWangzy/vecta
          --sha "$SOURCE_SHA"
          --branch "$SOURCE_BRANCH"
        env:
          VECTA_READ_TOKEN: ${{ secrets.VECTA_READ_TOKEN }}

      - name: Validate Fruit V4 isolated Compose contract
        run: python3 scripts/test_fruit_v4_isolated_compose_contract.py

      - name: Validate mypc RAG immutable release contract
        run: node scripts/test_mypc_rag_release_contract.mjs

      - name: Ensure production Nexus is running
        run: |
          set -euo pipefail
          [ -n "${NEXUS_ADMIN_PASSWORD:-}" ] || {
            echo "${NEXUS_ADMIN_PASSWORD_SECRET_NAME} secret is required" >&2
            exit 1
          }
          if ! docker ps -a --format '{{.Names}}' | grep -qx vecta-nexus; then
            docker volume create vecta-nexus-data
            docker run -d \
              --name vecta-nexus \
              --restart unless-stopped \
              -p 127.0.0.1:8081:8081 \
              -p 127.0.0.1:8082:8082 \
              -p 127.0.0.1:8083:8083 \
              -v vecta-nexus-data:/nexus-data \
              sonatype/nexus3:3.79.1
          else
            docker start vecta-nexus >/dev/null
          fi
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8081/service/rest/v1/status \
              >/dev/null; then
              break
            fi
            sleep 5
          done
          if ! curl -fsS http://127.0.0.1:8081/service/rest/v1/status \
            >/dev/null; then
            echo "Nexus did not become ready" >&2
            docker logs --tail 100 vecta-nexus >&2 || true
            exit 1
          fi
          if docker exec vecta-nexus test -s /nexus-data/admin.password; then
            initial_password="$(docker exec vecta-nexus \
              cat /nexus-data/admin.password | tr -d '\r\n')"
            curl -fsS \
              -u "admin:${initial_password}" \
              -X PUT \
              -H 'Content-Type: text/plain' \
              --data-binary "$NEXUS_ADMIN_PASSWORD" \
              http://127.0.0.1:8081/service/rest/v1/security/users/admin/change-password
            docker exec vecta-nexus rm -f /nexus-data/admin.password || true
          fi
          curl -fsS \
            -u "admin:${NEXUS_ADMIN_PASSWORD}" \
            http://127.0.0.1:8081/service/rest/v1/status >/dev/null
          eula_payload="$(curl -fsS \
            -u "admin:${NEXUS_ADMIN_PASSWORD}" \
            http://127.0.0.1:8081/service/rest/v1/system/eula \
            | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const status = JSON.parse(input);
                if (status.accepted === true) process.exit(0);
                status.accepted = true;
                process.stdout.write(JSON.stringify(status));
              });
            ')"
          if [ -n "$eula_payload" ]; then
            curl -fsS \
              -u "admin:${NEXUS_ADMIN_PASSWORD}" \
              -X POST \
              -H 'Content-Type: application/json' \
              --data-binary "$eula_payload" \
              http://127.0.0.1:8081/service/rest/v1/system/eula >/dev/null
          fi
        env:
          NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}

      - name: Provision production Nexus repositories
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'http://127.0.0.1:8081/service/rest/v1';
          const password = process.env.NEXUS_ADMIN_PASSWORD;
          const secretName = process.env.NEXUS_ADMIN_PASSWORD_SECRET_NAME
            || 'MYPC_NEXUS_ADMIN_PASSWORD';
          if (!password) throw new Error(`${secretName} is required`);
          const auth = 'Basic ' + Buffer
            .from(`admin:${password}`)
            .toString('base64');

          async function request(method, path, body, ok = [200, 201, 204]) {
            const res = await fetch(`${base}${path}`, {
              method,
              headers: {
                Authorization: auth,
                Accept: 'application/json',
                ...(body ? { 'Content-Type': 'application/json' } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            if (!ok.includes(res.status)) {
              const text = await res.text();
              throw new Error(`${method} ${path} -> ${res.status}: ${text}`);
            }
            return res;
          }

          async function exists(name) {
            const res = await request(
              'GET',
              `/repositories/${name}`,
              null,
              [200, 404],
            );
            return res.status === 200;
          }

          async function upsert(format, type, name, body) {
            const present = await exists(name);
            const suffix = present ? `/${name}` : '';
            await request(
              present ? 'PUT' : 'POST',
              `/repositories/${format}/${type}${suffix}`,
              body,
            );
          }

          const storage = {
            blobStoreName: 'default',
            strictContentTypeValidation: true,
          };
          const proxyDefaults = remoteUrl => ({
            online: true,
            storage,
            proxy: { remoteUrl, contentMaxAge: 1440, metadataMaxAge: 1440 },
            negativeCache: { enabled: true, timeToLive: 1440 },
            httpClient: {
              blocked: false,
              autoBlock: true,
              connection: { retries: 2, timeout: 300 },
            },
          });

          await upsert('npm', 'proxy', 'vecta-npm-proxy', {
            name: 'vecta-npm-proxy',
            ...proxyDefaults('https://registry.npmjs.org'),
          });
          await upsert('pypi', 'proxy', 'vecta-pypi-proxy', {
            name: 'vecta-pypi-proxy',
            ...proxyDefaults('https://pypi.org'),
            pypi: { indexPath: '/simple' },
          });
          for (const repo of [
            ['vecta-alpine-proxy', 'https://dl-cdn.alpinelinux.org/alpine'],
            ['vecta-debian-proxy', 'http://deb.debian.org/debian'],
            [
              'vecta-debian-security-proxy',
              'http://deb.debian.org/debian-security',
            ],
          ]) {
            await upsert('raw', 'proxy', repo[0], {
              name: repo[0],
              ...proxyDefaults(repo[1]),
              storage: {
                blobStoreName: 'default',
                strictContentTypeValidation: false,
              },
              raw: {
                contentDisposition: 'ATTACHMENT',
                forwardQueryParameters: true,
              },
            });
          }
          await upsert('docker', 'hosted', 'vecta-docker-local', {
            name: 'vecta-docker-local',
            online: true,
            storage: { ...storage, writePolicy: 'ALLOW' },
            docker: { v1Enabled: false, forceBasicAuth: true, httpPort: 8082 },
          });
          await upsert('docker', 'proxy', 'vecta-docker-remote', {
            name: 'vecta-docker-remote',
            // 2026-08-19: hub direct is unreachable from this network (Nexus
            // auto-blocked "Network is unreachable"); route via daocloud mirror.
            ...proxyDefaults('https://docker.m.daocloud.io'),
            docker: { v1Enabled: false, forceBasicAuth: true },
            dockerProxy: {
              indexType: 'REGISTRY',
              indexUrl: 'https://index.docker.io/',
            },
          });
          await upsert('docker', 'proxy', 'vecta-docker-ghcr-proxy', {
            name: 'vecta-docker-ghcr-proxy',
            ...proxyDefaults('https://ghcr.m.daocloud.io'),
            proxy: {
              remoteUrl: 'https://ghcr.m.daocloud.io',
              contentMaxAge: 1440,
              metadataMaxAge: 30,
            },
            docker: { v1Enabled: false, forceBasicAuth: true },
            dockerProxy: { indexType: 'CUSTOM' },
          });
          await upsert('docker', 'group', 'vecta-docker-virtual', {
            name: 'vecta-docker-virtual',
            online: true,
            storage,
            group: {
              memberNames: [
                'vecta-docker-remote',
                'vecta-docker-ghcr-proxy',
                'vecta-docker-local',
              ],
            },
            docker: { v1Enabled: false, forceBasicAuth: true, httpPort: 8083 },
          });
          NODE
          for port in 8082 8083; do
            for _ in $(seq 1 30); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:${port}/v2/" || true)"
              if printf '%s' "$code" | grep -Eq '^(200|401)$'; then
                break
              fi
              sleep 2
            done
          done
        env:
          NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}

      - name: Validate production image contract
        working-directory: infra/vecta
        run: pnpm check:production-images

      - name: Seed verified Hermes base image
        run: |
          set -euo pipefail
          seed_hermes=false
          if [ -z "${PRODUCTION_IMAGE_NAMES:-}" ]; then
            seed_hermes=true
          else
            IFS=',' read -r -a requested_images <<< "$PRODUCTION_IMAGE_NAMES"
            for requested_image in "${requested_images[@]}"; do
              requested_image="${requested_image//[[:space:]]/}"
              if [ "$requested_image" = 'employee-runtime' ]; then
                seed_hermes=true
                break
              fi
            done
          fi
          if [ "$seed_hermes" != true ]; then
            echo 'Hermes base sync skipped; employee-runtime is not selected'
            exit 0
          fi
          expected_group_tag_ref='127.0.0.1:8083/nousresearch/hermes-agent:v2026.8.19-3811ed13'
          expected_manifest_digest='sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09'
          expected_group_ref="${expected_group_tag_ref}@${expected_manifest_digest}"
          expected_target='nousresearch/hermes-agent:v2026.8.19-3811ed13'
          actual_group_ref="$(node -e '
            const fs = require("fs");
            const contract = JSON.parse(fs.readFileSync(
              "vecta/scripts/production-image-contract.json", "utf8",
            ));
            const employeeRuntime = contract.images.find(
              (image) => image.name === "employee-runtime",
            );
            const hermesBase = employeeRuntime?.baseImages?.find(
              (baseImage) => baseImage.arg === "HERMES_BASE",
            );
            if (!hermesBase?.groupRef) process.exit(1);
            process.stdout.write(hermesBase.groupRef);
          ')"
          if [ "$actual_group_ref" != "$expected_group_ref" ]; then
            echo "unexpected Hermes base contract: $actual_group_ref" >&2
            exit 1
          fi
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          docker_config="$(mktemp -d "${RUNNER_TEMP}/vecta-hermes-sync.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          printf '%s\n' "$NEXUS_ADMIN_PASSWORD" |
            docker login "$NEXUS_DOCKER_REGISTRY" -u admin --password-stdin
          printf '%s\n' "$NEXUS_ADMIN_PASSWORD" |
            docker login "$DOCKER_BASE_IMAGE_SOURCE_REGISTRY" -u admin --password-stdin
          command -v skopeo >/dev/null || {
            echo 'skopeo is required to preserve the Hermes OCI index' >&2
            exit 1
          }
          NEXUS_DOCKER_GROUP_REGISTRY="$DOCKER_BASE_IMAGE_SOURCE_REGISTRY" \
            NEXUS_SYNC_ONLY="$expected_target" \
            scripts/sync-mypc-nexus-images.sh --execute
          bash scripts/verify-nexus-image-digest.sh \
            "$expected_group_tag_ref" "$expected_manifest_digest"
        env:
          NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}

      - name: Build and push production images
        working-directory: infra/vecta
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          docker_config="$(mktemp -d "${RUNNER_TEMP}/vecta-docker-config.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          if [ ! -x "$BUILDX_PLUGIN_PATH" ]; then
            echo "Buildx plugin is required at $BUILDX_PLUGIN_PATH" >&2
            exit 1
          fi
          printf '%s  %s\n' "$BUILDX_LINUX_AMD64_SHA256" "$BUILDX_PLUGIN_PATH" |
            sha256sum --check -
          actual_buildx_version="$(docker buildx version | awk '{print $2}')"
          if [ "$actual_buildx_version" != "$BUILDX_VERSION" ]; then
            echo "Buildx version mismatch: expected=$BUILDX_VERSION actual=$actual_buildx_version" >&2
            exit 1
          fi
          docker buildx use default
          builder_info="$(docker buildx inspect default)"
          if ! printf '%s\n' "$builder_info" | grep -Eq '^Name:[[:space:]]+default$'; then
            echo "Buildx default builder is required" >&2
            exit 1
          fi
          if ! printf '%s\n' "$builder_info" | grep -Eq '^Driver:[[:space:]]+docker$'; then
            echo "Buildx default builder must use the docker driver" >&2
            exit 1
          fi
          printf '%s\n' "$NEXUS_ADMIN_PASSWORD" |
            docker login "$NEXUS_DOCKER_REGISTRY" -u admin --password-stdin
          printf '%s\n' "$NEXUS_ADMIN_PASSWORD" |
            docker login "$DOCKER_BASE_IMAGE_SOURCE_REGISTRY" -u admin --password-stdin
          nice -n 10 ionice -c2 -n7 \
            node scripts/build-push-production-images.mjs
        env:
          NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}

      - name: Stage immutable RAG release handoff
        run: |
          set -euo pipefail
          if [ -n "${PRODUCTION_IMAGE_NAMES:-}" ]; then
            rag_selected=false
            IFS=',' read -r -a requested_images <<< "$PRODUCTION_IMAGE_NAMES"
            for requested_image in "${requested_images[@]}"; do
              requested_image="${requested_image//[[:space:]]/}"
              if [ "$requested_image" = 'rag-service' ]; then
                rag_selected=true
                break
              fi
            done
            if [ "$rag_selected" != true ]; then
              echo 'RAG immutable release handoff skipped; rag-service is not selected'
              exit 0
            fi
          fi
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          docker_config="$(mktemp -d "${RUNNER_TEMP}/vecta-rag-release-stage.XXXXXX")"
          stage_dir=''
          cleanup() {
            rm -rf -- "$docker_config"
            if [ -n "$stage_dir" ]; then rm -rf -- "$stage_dir"; fi
          }
          trap cleanup EXIT
          unset DOCKER_HOST DOCKER_CONTEXT
          export DOCKER_CONFIG="$docker_config"
          printf '%s\n' "$NEXUS_ADMIN_PASSWORD" |
            docker login "$NEXUS_DOCKER_REGISTRY" -u admin --password-stdin
          image_tag="${NEXUS_DOCKER_REGISTRY}/rag-service:${SOURCE_SHA}"
          image_inspection="$(docker buildx imagetools inspect "$image_tag")"
          image_digest="$(printf '%s\n' "$image_inspection" | sed -n 's/^Digest:[[:space:]]*//p')"
          if ! printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo 'RAG image manifest did not yield one immutable digest' >&2
            exit 1
          fi
          RAG_SERVICE_IMAGE="${NEXUS_DOCKER_REGISTRY}/rag-service@${image_digest}"
          docker pull "$RAG_SERVICE_IMAGE" >/dev/null
          image_source_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RAG_SERVICE_IMAGE")"
          image_source_repository="$(docker image inspect --format '{{ index .Config.Labels "com.vecta.source.repository" }}' "$RAG_SERVICE_IMAGE")"
          if [ "$image_source_sha" != "$SOURCE_SHA" ] || [ "$image_source_repository" != 'ZenoWangzy/vecta' ]; then
            echo 'RAG image OCI provenance does not bind the selected VectA source' >&2
            exit 1
          fi
          release_parent="/data/ocee/vecta-infra-releases/${GITHUB_SHA}/rag-service"
          release_root="${release_parent}/${SOURCE_SHA}"
          if [ -e "$release_root" ]; then
            [ -f "${release_root}/release-manifest.env" ] || {
              echo 'existing RAG release handoff has no manifest' >&2; exit 1;
            }
            grep -qx "RAG_SERVICE_IMAGE=${RAG_SERVICE_IMAGE}" "${release_root}/release-manifest.env"
            grep -qx "RAG_SOURCE_SHA=${SOURCE_SHA}" "${release_root}/release-manifest.env"
            grep -qx "RAG_INFRA_SHA=${GITHUB_SHA}" "${release_root}/release-manifest.env"
            (
              cd "$release_root"
              sha256sum -c checksums.sha256 >/dev/null
            )
          else
            install -d -m 700 "$release_parent"
            stage_dir="$(mktemp -d "${release_parent}/.${SOURCE_SHA}.XXXXXX")"
            install -d -m 700 "${stage_dir}/scripts" "${stage_dir}/deploy/mypc"
            install -m 700 scripts/release-mypc-rag-service.sh "${stage_dir}/scripts/release-mypc-rag-service.sh"
            install -m 700 scripts/check-mypc-rag-release-contract.mjs "${stage_dir}/scripts/check-mypc-rag-release-contract.mjs"
            install -m 700 scripts/mypc-app-regression.sh "${stage_dir}/scripts/mypc-app-regression.sh"
            install -m 600 deploy/mypc/rag-hf-endpoint.override.yml "${stage_dir}/deploy/mypc/rag-hf-endpoint.override.yml"
            install -m 600 deploy/mypc/rag-service-image.override.yml "${stage_dir}/deploy/mypc/rag-service-image.override.yml"
            (
              cd "$stage_dir"
              sha256sum scripts/release-mypc-rag-service.sh \
                scripts/check-mypc-rag-release-contract.mjs \
                scripts/mypc-app-regression.sh \
                deploy/mypc/rag-hf-endpoint.override.yml \
                deploy/mypc/rag-service-image.override.yml > checksums.sha256
            )
            chmod 600 "${stage_dir}/checksums.sha256"
            {
              printf 'RAG_SERVICE_IMAGE=%s\n' "$RAG_SERVICE_IMAGE"
              printf 'RAG_SOURCE_SHA=%s\n' "$SOURCE_SHA"
              printf 'RAG_INFRA_SHA=%s\n' "$GITHUB_SHA"
            } > "${stage_dir}/release-manifest.env"
            chmod 600 "${stage_dir}/release-manifest.env"
            mv "$stage_dir" "$release_root"
            stage_dir=''
          fi
          echo "RAG immutable release handoff staged at ${release_root}"
        env:
          NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}

      - name: Prune mypc Docker build cache
        if: always() && inputs.docker_cache_prune_until != 'never'
        run: |
          set -euo pipefail
          if ! printf '%s' "$DOCKER_CACHE_PRUNE_UNTIL" \
            | grep -Eq '^[1-9][0-9]*[smhd]$'; then
            echo "refusing invalid Docker cache retention" >&2
            exit 1
          fi
          docker builder prune --force \
            --filter "until=${DOCKER_CACHE_PRUNE_UNTIL}"
