name: Release Vecta on mypc

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        description: Full 40-character Vecta main SHA to release
      mode:
        type: choice
        required: true
        default: release
        options:
          - release
          - hotfix
        description: Release mode recorded in the production Deployment
      services:
        type: string
        required: false
        default: ""
        description: Optional comma-separated production images to build and deploy
      scoped_manifest:
        type: string
        required: false
        default: ""
        description: Optional reviewed releases/scoped manifest name to constrain this release
      dry_run:
        type: boolean
        required: false
        default: false
        description: Validate the selected SHA and print the plan without acquiring the production lock or changing containers

permissions:
  contents: read

concurrency:
  group: mypc-production-release-v1
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'ZenoWangzy/vecta-infra' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mypc, prod-build]
    environment: production
    # Documented worst case: infra checkout 18 min (bootstrap 4.5 + route probes and fetch 13) + VectA fetch 30 min = 48 min.
    # 60 leaves 12 min for postsubmit (no documented bound, up to 100 ancestor lookups) and the quick checks.
    timeout-minutes: 60
    steps:
      - name: Checkout infra contract
        timeout-minutes: 18
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a full lowercase Git SHA" >&2; exit 1; }
          target="${GITHUB_WORKSPACE:?}"
          # actions/checkout has no slow-link retry: one 30 s stall killed runs 44391317843 and 44417360328.
          find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # The fetch script lives in the infra checkout it fetches, so bootstrap it at GITHUB_SHA first (bounded curl).
          # The bootstrap goes to api.github.com, which mypc reaches directly; the script then picks its own proxy route.
          boot="$(mktemp)"
          trap 'rm -f "$boot"' EXIT
          curl -fsSL --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 60 \
            --config <(printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github.raw+json"\n' "$FETCH_TOKEN") \
            -o "$boot" "https://api.github.com/repos/ZenoWangzy/vecta-infra/contents/scripts/resilient-fetch.sh?ref=$GITHUB_SHA"
          bash "$boot" https://github.com/ZenoWangzy/vecta-infra.git "$GITHUB_SHA" "$target"
          test "$(git -C "$target" rev-parse HEAD)" = "$GITHUB_SHA"
          [ -z "$(git -C "$target" status --porcelain --untracked-files=all)" ]

      - name: Validate workflow inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase 40-character SHA' >&2
            exit 64
          }
          [[ "$RELEASE_MODE" == release || "$RELEASE_MODE" == hotfix ]] || {
            echo 'mode must be release or hotfix' >&2
            exit 64
          }

      - name: Fetch selected Vecta source and main history
        timeout-minutes: 30
        run: bash scripts/fetch-vecta-source.sh --with-main-history
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: main
          VECTA_READ_TOKEN: ${{ secrets.VECTA_PRODUCTION_READ_TOKEN }}

      - name: Require selected source on main with green Postsubmit evidence
        run: |
          set -euo pipefail
          python3 scripts/verify-vecta-postsubmit.py \
            --repo ZenoWangzy/vecta --sha "$SOURCE_SHA" --branch main \
            --vecta-checkout vecta
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VECTA_READ_TOKEN: ${{ secrets.VECTA_PRODUCTION_READ_TOKEN }}

      - name: Verify approved backport and exact Postsubmit evidence
        if: inputs.scoped_manifest != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_SERVICES: ${{ inputs.services }}
          SCOPED_MANIFEST: ${{ inputs.scoped_manifest }}
          VECTA_READ_TOKEN: ${{ secrets.VECTA_PRODUCTION_READ_TOKEN }}
        run: bash scripts/check-scoped-release.sh

      - name: Validate requested image names
        env:
          REQUESTED_IMAGES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const contract = JSON.parse(fs.readFileSync('vecta/scripts/production-image-contract.json', 'utf8'));
          const available = contract.images.map((image) => image.name);
          const raw = process.env.REQUESTED_IMAGES || '';
          const requested = raw.split(',').map((name) => name.trim()).filter(Boolean);
          if (raw.trim() && requested.length === 0) throw new Error('services must contain a production image name');
          const unknown = requested.filter((name) => !available.includes(name));
          if (unknown.length) throw new Error(`Unknown production images: ${unknown.join(', ')}`);
          if (new Set(requested).size !== requested.length) throw new Error('services contains duplicate image names');
          console.log(`Validated source ${process.env.GITHUB_SHA || 'workflow input'} and ${requested.length || 'all'} requested image(s)`);
          NODE

  build:
    if: ${{ inputs.dry_run != true }}
    needs: validate
    uses: ./.github/workflows/build-mypc-images.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      source_branch: main
      image_names: ${{ inputs.services }}
    secrets:
      MYPC_NEXUS_ADMIN_PASSWORD: ${{ secrets.MYPC_NEXUS_ADMIN_PASSWORD }}
      VECTA_READ_TOKEN: ${{ secrets.VECTA_READ_TOKEN }}

  deploy:
    needs: [validate, build]
    if: >-
      always() && needs.validate.result == 'success' &&
      (inputs.dry_run == true || needs.build.result == 'success')
    runs-on: [self-hosted, mypc, prod-build]
    environment: production
    timeout-minutes: 240
    steps:
      - name: Preflight root SSH to local runner
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          command -v ssh >/dev/null || {
            echo "runner user '$runner_user' needs openssh-client installed to reach root@127.0.0.1" >&2
            exit 78
          }
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@127.0.0.1 true || {
            echo "runner user '$runner_user' must authorize its SSH key for root@127.0.0.1; install openssh-client if missing and configure root's authorized_keys" >&2
            exit 78
          }

      - name: Checkout infra release contract
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a full lowercase Git SHA" >&2; exit 1; }
          target="${GITHUB_WORKSPACE:?}"
          # actions/checkout has no slow-link retry: one 30 s stall killed runs 44391317843 and 44417360328.
          find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # The fetch script lives in the infra checkout it fetches, so bootstrap it at GITHUB_SHA first (bounded curl).
          # The bootstrap goes to api.github.com, which mypc reaches directly; the script then picks its own proxy route.
          boot="$(mktemp)"
          trap 'rm -f "$boot"' EXIT
          curl -fsSL --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 60 \
            --config <(printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github.raw+json"\n' "$FETCH_TOKEN") \
            -o "$boot" "https://api.github.com/repos/ZenoWangzy/vecta-infra/contents/scripts/resilient-fetch.sh?ref=$GITHUB_SHA"
          bash "$boot" https://github.com/ZenoWangzy/vecta-infra.git "$GITHUB_SHA" "$target"
          test "$(git -C "$target" rev-parse HEAD)" = "$GITHUB_SHA"
          [ -z "$(git -C "$target" status --porcelain --untracked-files=all)" ]

      - name: Initialize mypc-local release state
        run: |
          set -euo pipefail
          AGENT_HOME="$HOME/.vecta-agent/mypc-release"
          mkdir -p "$AGENT_HOME/engine-versions" "$AGENT_HOME/engine-sync"
          chmod 700 "$AGENT_HOME" "$AGENT_HOME/engine-versions" "$AGENT_HOME/engine-sync"
          echo "AGENT_HOME=$AGENT_HOME" >> "$GITHUB_ENV"

      - name: Fetch selected Vecta source and main history
        run: bash scripts/fetch-vecta-source.sh --with-main-history
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: main
          VECTA_READ_TOKEN: ${{ secrets.VECTA_PRODUCTION_READ_TOKEN }}

      - name: Read the selected Vecta engine pin
        id: engine-pin
        run: |
          set -euo pipefail
          engine_sha="$(jq -er '.engine | select(test("^[0-9a-f]{40}$"))' vecta/.zenoforge/build.json)"
          echo "sha=$engine_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Zenoforge engine source
        env:
          ENGINE_SHA: ${{ steps.engine-pin.outputs.sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/zenoforge"
          bash scripts/resilient-fetch.sh https://github.com/ZenoWangzy/zenoforge "$ENGINE_SHA" "$GITHUB_WORKSPACE/zenoforge" /home/github-runner/.cache/zenoforge.git

      - name: Build the pinned Vecta engine pack
        env:
          PINNED_ENGINE_SHA: ${{ steps.engine-pin.outputs.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          engine_sha="$PINNED_ENGINE_SHA"
          ENGINE_SYNC_STATE_DIR="$AGENT_HOME/engine-sync" \
          ZF_LOCAL_CLONE="$GITHUB_WORKSPACE/zenoforge" \
          ZF_URL=https://github.com/ZenoWangzy/zenoforge \
          VECTA_DIR="$GITHUB_WORKSPACE/vecta" \
          ZF_TARGET_CHECKOUT="$GITHUB_WORKSPACE/vecta" \
            bash vecta/.zenoforge/build/engine-sync.sh --build "$engine_sha" \
              "$SOURCE_SHA" --out "$AGENT_HOME/engine-versions"
          # Same id engine-sync.sh names the dir with (and its converge computes): engine12-pack12-review12-advisor12.
          vecta_rev() { git -C "$GITHUB_WORKSPACE/vecta" rev-parse --verify --short=12 "$SOURCE_SHA:$1"; }
          version_id="${engine_sha:0:12}-$(vecta_rev .zenoforge/build/pack)-$(vecta_rev .agents/skills/vecta-code-review)-$(vecta_rev .agents/skills/web-advisor-provider)"
          version_dir="$AGENT_HOME/engine-versions/$version_id"
          [[ -r "$version_dir/engine/lib.sh" ]] || {
            echo "pinned Vecta engine pack $version_id was not produced" >&2
            exit 1
          }
          echo "ZF_ENGINE_DIR=$version_dir/engine" >> "$GITHUB_ENV"

      - name: Prepare authenticated acceptance credentials
        if: ${{ inputs.dry_run != true }}
        env:
          VECTA_PRODUCTION_ACCEPTANCE_ENV: ${{ secrets.VECTA_PRODUCTION_ACCEPTANCE_ENV }}
        run: |
          set -euo pipefail
          [[ -n "$VECTA_PRODUCTION_ACCEPTANCE_ENV" ]] || {
            echo 'production environment secret VECTA_PRODUCTION_ACCEPTANCE_ENV is required' >&2
            exit 78
          }
          umask 077
          printf '%s\n' "$VECTA_PRODUCTION_ACCEPTANCE_ENV" > "$AGENT_HOME/acceptance-l1.env"
          chmod 600 "$AGENT_HOME/acceptance-l1.env"

      - name: Deploy or print dry-run plan
        env:
          GH_TOKEN: ${{ inputs.dry_run && secrets.VECTA_PRODUCTION_READ_TOKEN || secrets.VECTA_PRODUCTION_RELEASE_TOKEN }}
          RELEASE_BUILD_ALREADY_COMPLETED: ${{ inputs.dry_run != true && '1' || '0' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SERVICES: ${{ inputs.services }}
          SCOPED_MANIFEST: ${{ inputs.scoped_manifest }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_HOST: root@127.0.0.1
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo 'production environment needs VECTA_PRODUCTION_RELEASE_TOKEN for deployment and VECTA_PRODUCTION_READ_TOKEN for dry-run' >&2
            exit 78
          }
          # run-release's git_fetch_bounded fetches origin main from GitHub; this runner has no git credential
          # and that bulk link is too slow. Serve the URL from the warm cache, for this step's env only.
          # insteadOf also rewrites pushes, so pushes go back to GitHub, authenticated by GH_TOKEN.
          cache=/home/github-runner/.cache/vecta-main.git
          if [[ -d "$cache" ]]; then
            export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0="url.$cache.insteadOf" GIT_CONFIG_VALUE_0=https://github.com/ZenoWangzy/vecta.git GIT_CONFIG_KEY_1=url.https://github.com/ZenoWangzy/vecta.git.pushInsteadOf GIT_CONFIG_VALUE_1=https://github.com/ZenoWangzy/vecta.git GIT_CONFIG_KEY_2=credential.https://github.com.helper GIT_CONFIG_VALUE_2='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          fi
          args=(--source-sha "$SOURCE_SHA" --mode "$RELEASE_MODE")
          if [[ -n "$RELEASE_SERVICES" ]]; then args+=(--services "$RELEASE_SERVICES"); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ -n "$SCOPED_MANIFEST" ]]; then
            GH_TOKEN="$GH_TOKEN" VECTA_READ_TOKEN="$GH_TOKEN" bash scripts/run-scoped-release.sh "${args[@]}"
            exit
          fi
          GH_TOKEN="$GH_TOKEN" VECTA_READ_TOKEN="$GH_TOKEN" \
            bash vecta/scripts/release/mypc-release.sh "${args[@]}"

      - name: Remove authenticated acceptance credentials
        if: always()
        run: rm -f -- "$HOME/.vecta-agent/mypc-release/acceptance-l1.env"
