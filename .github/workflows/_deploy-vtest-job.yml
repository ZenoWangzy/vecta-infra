# Reusable workflow called by vecta app repo stub and by manual dispatch.
# Runs on the vtest self-hosted runner (co-located with the vtest host).
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
        description: "Docker image tag (commit SHA) to deploy"
      run_migrations:
        type: boolean
        default: false
        description: "Whether to run DB migrations before deploy"
      tags:
        type: string
        default: open-webui,vecta-app
        description: "Ansible tags to run (vecta-app, infra, search, open-webui, openclaw, nexus, jfrog, all)"
      migration_artifact_run_id:
        type: string
        default: ''
        description: "GitHub run ID containing the migration-sqls artifact"
      docker_cache_prune_until:
        type: string
        default: 48h
        description: "Docker cache retention on the vtest runner after deploy; set to 'never' to skip"
      fruit_bootstrap:
        type: boolean
        default: false
        description: "Run the reviewed Fruit schema and runtime-role bootstrap before service deployment"
    secrets:
      VTEST_DATABASE_URL:
        required: true
      SERVICE_KEY:
        required: true
      NEXUS_ADMIN_PASSWORD:
        required: true
      WECOM_CORP_ID:
        required: false
      WECOM_CONTACTS_SECRET:
        required: false
      WECOM_BOT_ID:
        required: false
      WECOM_BOT_SECRET:
        required: false
      PROXY_USERNAME:
        required: false
      PROXY_PASSWORD:
        required: false
      PROXY_PREVIOUS_PASSWORD:
        required: false
      # vecta #408 platform service JWTs. Optional so an unprovisioned environment still
      # deploys everything else, but a2a-router will not start without the channel token.
      VTEST_PLATFORM_SERVICE_JWT_PUBLIC_KEY:
        required: false
      VTEST_CHANNEL_PLATFORM_SERVICE_TOKEN:
        required: false
      VTEST_FLEET_PLATFORM_SERVICE_TOKEN:
        required: false
      VTEST_FLEET_FRUIT_PLATFORM_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: [self-hosted, vtest]
    concurrency:
      group: vtest-deploy
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.VTEST_DATABASE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      NEXUS_ADMIN_PASSWORD: ${{ secrets.NEXUS_ADMIN_PASSWORD }}
      WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
      WECOM_CONTACTS_SECRET: ${{ secrets.WECOM_CONTACTS_SECRET }}
      WECOM_BOT_ID: ${{ secrets.WECOM_BOT_ID }}
      WECOM_BOT_SECRET: ${{ secrets.WECOM_BOT_SECRET }}
      # Ansible reads these through lookup('env', ...) in roles/vecta-app/tasks/*.yml.
      PLATFORM_SERVICE_JWT_PUBLIC_KEY: ${{ secrets.VTEST_PLATFORM_SERVICE_JWT_PUBLIC_KEY }}
      CHANNEL_PLATFORM_SERVICE_TOKEN: ${{ secrets.VTEST_CHANNEL_PLATFORM_SERVICE_TOKEN }}
      FLEET_PLATFORM_SERVICE_TOKEN: ${{ secrets.VTEST_FLEET_PLATFORM_SERVICE_TOKEN }}
      FLEET_FRUIT_PLATFORM_TOKEN: ${{ secrets.VTEST_FLEET_FRUIT_PLATFORM_TOKEN }}
      DEPLOY_SHA: ${{ inputs.image_tag }}
      VTEST_ALLOW_MIGRATE: ${{ inputs.run_migrations && '1' || '0' }}
      DEPLOY_TAGS: ${{ inputs.tags || 'open-webui,vecta-app,fruit-vtest' }}
      VTEST_FRUIT_BOOTSTRAP: ${{ inputs.fruit_bootstrap && '1' || '0' }}
    steps:
      - name: Configure git proxy and check out vecta-infra
        run: |
          set -euo pipefail
          home_input="${HOME:-}"
          [ -n "$home_input" ] || { echo "HOME is required for the workspace guard" >&2; exit 1; }
          home_resolved="$(cd -- "$home_input" && pwd -P)"
          runner_workspace_input="${RUNNER_WORKSPACE:-}"
          [ -n "$runner_workspace_input" ] || { echo "RUNNER_WORKSPACE is required" >&2; exit 1; }
          case "$runner_workspace_input" in
            /*) ;;
            *) echo "RUNNER_WORKSPACE must be an absolute path" >&2; exit 1 ;;
          esac
          [ -d "$runner_workspace_input" ] || { echo "RUNNER_WORKSPACE must exist" >&2; exit 1; }
          runner_workspace_resolved="$(cd -- "$runner_workspace_input" && pwd -P)"
          [ "$runner_workspace_resolved" = "$RUNNER_WORKSPACE" ] || { echo "resolved runner workspace must equal RUNNER_WORKSPACE" >&2; exit 1; }
          [ "$runner_workspace_resolved" != "/" ] || { echo "refusing a filesystem-root runner workspace" >&2; exit 1; }
          [ "$runner_workspace_resolved" != "$home_resolved" ] || { echo "refusing a HOME runner workspace" >&2; exit 1; }
          workspace_input="${GITHUB_WORKSPACE:-}"
          [ -n "$workspace_input" ] || { echo "GITHUB_WORKSPACE is required" >&2; exit 1; }
          case "$workspace_input" in
            /*) ;;
            *) echo "GITHUB_WORKSPACE must be an absolute path" >&2; exit 1 ;;
          esac
          [ -d "$workspace_input" ] || { echo "GITHUB_WORKSPACE must exist" >&2; exit 1; }
          workspace_resolved="$(cd -- "$workspace_input" && pwd -P)"
          [ "$workspace_resolved" = "$GITHUB_WORKSPACE" ] || { echo "resolved workspace must equal GITHUB_WORKSPACE" >&2; exit 1; }
          [ "$workspace_resolved" != "/" ] || { echo "refusing to clean the filesystem root" >&2; exit 1; }
          [ "$workspace_resolved" != "$home_resolved" ] || { echo "refusing to clean HOME" >&2; exit 1; }
          case "$workspace_resolved" in
            "$runner_workspace_resolved"/*) ;;
            *) echo "GITHUB_WORKSPACE must be a strict child of RUNNER_WORKSPACE" >&2; exit 1 ;;
          esac
          [ "$(pwd -P)" = "$workspace_resolved" ] || { echo "current directory must equal GITHUB_WORKSPACE" >&2; exit 1; }
          cleanup_git_configuration() {
            unset proxy_url proxy_username_encoded proxy_password_encoded GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_KEY_1 GIT_CONFIG_KEY_2 GIT_CONFIG_KEY_3 GIT_CONFIG_KEY_4 GIT_CONFIG_VALUE_0 GIT_CONFIG_VALUE_1 GIT_CONFIG_VALUE_2 GIT_CONFIG_VALUE_3 GIT_CONFIG_VALUE_4
          }
          trap cleanup_git_configuration EXIT
          export GIT_CONFIG_COUNT=5
          export GIT_CONFIG_KEY_0=http.lowSpeedLimit
          export GIT_CONFIG_VALUE_0=1024
          export GIT_CONFIG_KEY_1=http.lowSpeedTime
          export GIT_CONFIG_VALUE_1=10
          export GIT_CONFIG_KEY_2=http.proxy
          export GIT_CONFIG_VALUE_2=
          export GIT_CONFIG_KEY_3=https.proxy
          export GIT_CONFIG_VALUE_3=
          export GIT_CONFIG_KEY_4=remote.origin.url
          export GIT_CONFIG_VALUE_4=https://github.com/ZenoWangzy/vecta-infra.git
          # Drop caller checkout metadata only after the workspace guards above.
          rm -rf -- .git
          git init --quiet
          if timeout 30s git fetch --depth=1 origin main; then
            echo "direct public GitHub checkout succeeded"
          else
            if [ -z "${PROXY_USERNAME:-}" ] || [ -z "${PROXY_PASSWORD:-}" ]; then
              echo "direct public GitHub checkout failed and proxy secrets are not configured" >&2
              exit 1
            fi
            proxy_username_encoded="$(printf '%s' "${PROXY_USERNAME}" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')"
            proxy_password_encoded="$(printf '%s' "${PROXY_PASSWORD}" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')"
            proxy_url="http://${proxy_username_encoded}:${proxy_password_encoded}@geraldsynnas.ddns.net:8888"
            # Keep proxy credentials in this shell/process environment, never a git argv or file.
            export GIT_CONFIG_VALUE_2="$proxy_url"
            export GIT_CONFIG_VALUE_3="$proxy_url"
            echo "direct public GitHub checkout failed; retrying through configured proxy"
            if ! timeout 30s git fetch --depth=1 origin main; then
              echo "configured proxy GitHub checkout failed" >&2
              exit 1
            fi
          fi
          git checkout --force FETCH_HEAD
          git reset --hard FETCH_HEAD
          git clean -ffdx
        env:
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null

      - name: Download migration SQL files
        if: inputs.migration_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: migration-sqls
          run-id: ${{ inputs.migration_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/migration-sqls

      - name: Fail closed if secrets missing
        run: |
          for v in DATABASE_URL SERVICE_KEY NEXUS_ADMIN_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "secret $v missing — refusing to deploy"; exit 1; }
          done

      - name: Validate image tag is immutable full SHA
        run: |
          case "$DEPLOY_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "image_tag must be a full 40-character lowercase Git SHA" >&2; exit 1 ;;
          esac

      - name: Deploy via Ansible
        run: |
          set -euo pipefail
          ci_wecom_corp_id="${WECOM_CORP_ID:-}"
          ci_wecom_contacts_secret="${WECOM_CONTACTS_SECRET:-}"
          ci_wecom_bot_id="${WECOM_BOT_ID:-}"
          ci_wecom_bot_secret="${WECOM_BOT_SECRET:-}"
          ci_proxy_username_set="${PROXY_USERNAME+x}"
          ci_proxy_password_set="${PROXY_PASSWORD+x}"
          ci_proxy_previous_password_set="${PROXY_PREVIOUS_PASSWORD+x}"
          ci_proxy_username="${PROXY_USERNAME:-}"
          ci_proxy_password="${PROXY_PASSWORD:-}"
          ci_proxy_previous_password="${PROXY_PREVIOUS_PASSWORD:-}"
          if [ -f /data/ocee/.env ]; then
            set -a
            . /data/ocee/.env
            set +a
          fi
          if [ -n "$ci_proxy_username_set" ]; then export PROXY_USERNAME="$ci_proxy_username"; else unset PROXY_USERNAME; fi
          if [ -n "$ci_proxy_password_set" ]; then export PROXY_PASSWORD="$ci_proxy_password"; else unset PROXY_PASSWORD; fi
          if [ -n "$ci_proxy_previous_password_set" ]; then export PROXY_PREVIOUS_PASSWORD="$ci_proxy_previous_password"; else unset PROXY_PREVIOUS_PASSWORD; fi
          export SERVICE_KEY="${OPENWEBUI_SERVICE_KEY:-${SERVICE_KEY:-}}"
          [ -n "$ci_wecom_corp_id" ] && export WECOM_CORP_ID="$ci_wecom_corp_id"
          [ -n "$ci_wecom_contacts_secret" ] && export WECOM_CONTACTS_SECRET="$ci_wecom_contacts_secret"
          [ -n "$ci_wecom_bot_id" ] && export WECOM_BOT_ID="$ci_wecom_bot_id"
          [ -n "$ci_wecom_bot_secret" ] && export WECOM_BOT_SECRET="$ci_wecom_bot_secret"
          echo "$NEXUS_ADMIN_PASSWORD" | docker login 127.0.0.1:8082 -u admin --password-stdin
          ansible-playbook playbooks/deploy.yml \
            -i inventories/vtest/hosts.ini \
            -e "deploy_sha=$DEPLOY_SHA" \
            -e "vtest_allow_migrate=$VTEST_ALLOW_MIGRATE" \
            -e "fruit_vtest_bootstrap=$VTEST_FRUIT_BOOTSTRAP" \
            -e "vtest_migration_files=$(ls /tmp/migration-sqls/*.sql 2>/dev/null | tr '\n' ',' | sed 's/,$//' || echo '')" \
            --tags "${DEPLOY_TAGS:-open-webui,vecta-app,fruit-vtest}"
          unset PROXY_PREVIOUS_PASSWORD ci_proxy_previous_password
        env:
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_PREVIOUS_PASSWORD: ${{ secrets.PROXY_PREVIOUS_PASSWORD }}

      - name: Prune vtest Docker build state
        if: always()
        run: |
          if [ ! -f scripts/prune-vtest-docker-build-state.sh ]; then
            echo "Skipping Docker build-state prune because the checkout did not provide its script"
            exit 0
          fi
          bash scripts/prune-vtest-docker-build-state.sh
        env:
          VTEST_DOCKER_CACHE_PRUNE_UNTIL: ${{ inputs.docker_cache_prune_until }}
